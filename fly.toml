app = "seazn-club-prod"
primary_region = "lhr"

[build]
  # NEXT_PUBLIC_* vars baked into bundle at build time — not secrets.
  [build.args]
    NEXT_PUBLIC_SUPABASE_URL          = "https://mdkqvykjsnjmuzdhygxd.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY     = "sb_publishable_IKT-7qoQhOKPbV2VcxK3-A_vY8939Rw"
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = "pk_live_51C2ImvAy22H0xqqxgyR2ApR8e7CmW5JFy2abbBFvk3bWPeL69Hk446YoOc1PO0G6c68i0QUcOzmj2tWGwDTZSVPf00lL1B0gIF"
    NEXT_PUBLIC_BASE_URL              = "https://seazn.club"
    NEXT_PUBLIC_POSTHOG_KEY            = "phc_ACmj7g38QKBUqi6dEtY25ccDJQfHKRotSS8RSedXAbdb"
    NEXT_PUBLIC_POSTHOG_HOST           = "https://eu.posthog.com"
    NEXT_PUBLIC_SENTRY_DSN          = "https://7ce8d8933b2291575f99fd0e7e1c6447@o4512107033198592.ingest.de.sentry.io/4512107042963536"  # uncomment when Sentry project created

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "suspend"
  auto_start_machines  = true
  min_machines_running = 1          # floor auto_stop_machines won't cross; peers
                                    # stay ISR-coherent via /api/internal/revalidate.
                                    # Ceiling is 3 machines total, set via
                                    # `fly scale count 3 -a seazn-club-prod` —
                                    # fly.toml has no max_machines_running key.

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/api/health"
    protocol     = "http"
    timeout      = "5s"

[[vm]]
    cpu_kind = "shared"
    cpus = 4
    memory = "1gb"
    memory_mb = 1_024
    processes = [ "app" ]
    size = "shared-cpu-4x"
