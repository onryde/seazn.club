      - name: Upload report and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-flags-on
          path: load-out/
          if-no-files-found: warn

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [baseline, flags-on]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: load-*
      - name: Write the comparison table
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const read = (n) => {
            const d = `reports/load-${n}`;
            const rd = (f) => { try { return fs.readFileSync(`${d}/${f}`, "utf8"); } catch { return null; } };
            const rep = rd("report.json");
            const js = (f) => { try { return JSON.parse(rd(f) ?? "null"); } catch { return null; } };
            return { report: rep ? JSON.parse(rep) : null, log: rd("server.log") ?? "", exit: (rd("exit.txt") ?? "no exit file").trim(), boot: js("lila/boot.json"), after: js("lila/after-run.json") };
          };
          const cols = { baseline: read("baseline"), "flags-on": read("flags-on") };
          const get = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
          const f = (v) => (v == null ? "n/a" : String(v));
          const rows = [
            ["calls per board (all RealtimeKit calls)", (c) => get(c.report, "rtkHeadroom.callsPerBoard")],
            ["seat p50 ms (arrival to seated)", (c) => get(c.report, "checkIn.arrivalToSeatedMs.p50")],
            ["seat p95 ms", (c) => get(c.report, "checkIn.arrivalToSeatedMs.p95")],
            ["room read p95 ms", (c) => get(c.report, "latencyMs.room read.p95")],
            ["lockWaitMs p95", (c) => get(c.report, "capacity.gateLock.waitMs.p95")],
            ["busy (gate lock busy)", (c) => get(c.report, "capacity.gateLock.busyRefusals")],
            ["presenceFallbackCount (server log lines)", (c) => c.log.split("\n").filter((l) => l.includes("fell back to the vendor's session read")).length],
            ["webhooks emitted / delivered", (c) => `${f(get(c.report, "webhooks.emitted"))} / ${f(get(c.report, "webhooks.delivered"))}`],
            ["shadow closedByEnded", (c) => get(c.report, "webhooks.shadow.closedByEnded")],
            ["lichess backend", (c) => (c.report ? get(c.report, "lichess.backend") ?? "fixture" : null)],
            ["games seen (all divisions)", (c) => (Array.isArray(get(c.report, "byDivision")) ? get(c.report, "byDivision").reduce((a, d) => a + d.gamesSeen, 0) : null)],
            ["lichess calls total / creates (lila accepted)", (c) => `${f(get(c.report, "lichess.total"))} / ${f(get(c.report, "lichess.creates"))} (${f(get(c.report, "lichess.createsAccepted"))})`],
            ["lichess 429s", (c) => get(c.report, "lichess.status429")],
            ["first 429 (endpoint @ second)", (c) => { const x = get(c.report, "lichess.first429"); return x ? `${x.endpoint} @ ${x.atSecond}s` : null; }],
            ["lila games by status", (c) => { const x = get(c.report, "lichess.games.byStatus"); return x ? JSON.stringify(x) : null; }],
            ["lila image digest (pinned?)", (c) => (c.boot ? `${String(c.boot.digest).replace(/^.*@/, "")} (${c.boot.pinned ? "pinned" : "NOT the pin"})` : null)],
            ["lila limiter canary (6 creates)", (c) => (get(c.boot, "canary.statuses") ? `${c.boot.canary.statuses.join(" ")}${c.boot.canary.limiterLive ? " - limiter live" : ""}` : null)],
            ["lila ratelimit log lines (run)", (c) => get(c.after, "ratelimitLines")],
            ["run seconds", (c) => get(c.report, "runSeconds")],
            ["job exit (playwright)", (c) => c.exit],
          ];
          console.log("## Check-in capacity load run\n");
          console.log("| metric | baseline (flags off) | flags on |\n| --- | --- | --- |");
          for (const [label, fn] of rows) console.log(`| ${label} | ${f(fn(cols.baseline))} | ${f(fn(cols["flags-on"]))} |`);
          console.log(`\nJob results: baseline=${process.env.R_BASE}, flags-on=${process.env.R_FLAGS}`);
          for (const [n, c] of Object.entries(cols)) {
            const fl = get(c.report, "failures");
            if (Array.isArray(fl) && fl.length) console.log(`\n**${n} failures:**\n` + fl.map((x) => `- ${typeof x === "string" ? x : JSON.stringify(x)}`).join("\n"));
          }
          // The policy mix and one row per seeded division, so the page tells a two-division run from a one-division run.
          for (const [n, c] of Object.entries(cols)) {
            const mix = get(c.report, "config.policyMix");
            const divs = get(c.report, "byDivision");
            console.log(`\n**${n}: policy mix** ${Array.isArray(mix) ? mix.map((m) => `${m.policy}:${m.boards}`).join(", ") : "n/a"}\n`);
            if (!Array.isArray(divs) || divs.length === 0) { console.log("byDivision: n/a"); continue; }
            console.log("| division | policy | boards | players | games seen | boards without game | seat p50 ms | seat p95 ms |\n| --- | --- | --- | --- | --- | --- | --- | --- |");
            for (const d of divs) console.log(`| ${f(d.division)} | ${f(d.policy)} | ${f(d.boards)} | ${f(d.players)} | ${f(d.gamesSeen)} | ${f(d.boardsWithoutGame)} | ${f(get(d, "arrivalToSeatedMs.p50"))} | ${f(get(d, "arrivalToSeatedMs.p95"))} |`);
          }
          for (const [n, c] of Object.entries(cols)) {
            const s = get(c.report, "lichess.statusByPath");
            if (s) console.log(`\n**${n}: lila's answers by endpoint (status: count)**\n\n` + Object.entries(s).map(([k, v]) => `- ${k}: ${JSON.stringify(v)}`).join("\n"));
          }
          JS
        env:
          R_BASE: ${{ needs.baseline.result }}
          R_FLAGS: ${{ needs['flags-on'].result }}
