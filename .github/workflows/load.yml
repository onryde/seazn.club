  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [baseline, flags-on]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: load-*
      - name: Write the comparison table
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const read = (n) => {
            const d = `reports/load-${n}`;
            const rd = (f) => { try { return fs.readFileSync(`${d}/${f}`, "utf8"); } catch { return null; } };
            const rep = rd("report.json");
            return { report: rep ? JSON.parse(rep) : null, log: rd("server.log") ?? "", exit: (rd("exit.txt") ?? "no exit file").trim() };
          };
          const cols = { baseline: read("baseline"), "flags-on": read("flags-on") };
          const get = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
          const f = (v) => (v == null ? "n/a" : String(v));
          const rows = [
            ["calls per board (all RealtimeKit calls)", (c) => get(c.report, "rtkHeadroom.callsPerBoard")],
            ["seat p50 ms (arrival to seated)", (c) => get(c.report, "checkIn.arrivalToSeatedMs.p50")],
            ["seat p95 ms", (c) => get(c.report, "checkIn.arrivalToSeatedMs.p95")],
            ["room read p95 ms", (c) => get(c.report, "latencyMs.room read.p95")],
            ["lockWaitMs p95", (c) => get(c.report, "capacity.gateLock.waitMs.p95")],
            ["busy (gate lock busy)", (c) => get(c.report, "capacity.gateLock.busyRefusals")],
            ["presenceFallbackCount (server log lines)", (c) => c.log.split("\n").filter((l) => l.includes("fell back to the vendor's session read")).length],
            ["webhooks emitted / delivered", (c) => `${f(get(c.report, "webhooks.emitted"))} / ${f(get(c.report, "webhooks.delivered"))}`],
            ["shadow closedByEnded", (c) => get(c.report, "webhooks.shadow.closedByEnded")],
            ["run seconds", (c) => get(c.report, "runSeconds")],
            ["job exit (playwright)", (c) => c.exit],
          ];
          console.log("## Check-in capacity load run\n");
          console.log("| metric | baseline (flags off) | flags on |\n| --- | --- | --- |");
          for (const [label, fn] of rows) console.log(`| ${label} | ${f(fn(cols.baseline))} | ${f(fn(cols["flags-on"]))} |`);
          console.log(`\nJob results: baseline=${process.env.R_BASE}, flags-on=${process.env.R_FLAGS}`);
          for (const [n, c] of Object.entries(cols)) {
            const fl = get(c.report, "failures");
            if (Array.isArray(fl) && fl.length) console.log(`\n**${n} failures:**\n` + fl.map((x) => `- ${typeof x === "string" ? x : JSON.stringify(x)}`).join("\n"));
          }
          JS
        env:
          R_BASE: ${{ needs.baseline.result }}
          R_FLAGS: ${{ needs['flags-on'].result }}
