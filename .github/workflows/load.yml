name: Load

# Check-in capacity load harness (apps/web/e2e/load/chess-30-boards.load.ts) on a quiet hosted runner.
# workflow_dispatch ONLY, never on push or PR: a run is ~20-30 minutes per job. The branch under test is the dispatch
# ref: `gh workflow run load.yml --ref <branch> -f boards=100 -f scenario=B`.
#
# Two jobs, each with its own Postgres, production build and server on localhost (the harness's fixture vendors listen
# on 127.0.0.1, so this cannot target staging):
#   baseline  flags OFF (EXTERNAL_PLAY_WINDOW_DEFER=0 too: the harness teardown needs the sweep undeferred)
#   flags-on  EXTERNAL_PLAY_PREMINT=1, EXTERNAL_PLAY_PRESENCE_PROOF=1, LOAD_PRESENCE_PROOF=1 (must equal the server flag),
#             EXTERNAL_PLAY_WINDOW_DEFER=0 (this load server only)
# BOTH run LOAD_WEBHOOKS=1 so the comparison isolates the two flags. NOTE the recorded baseline in
# docs/superpowers/plans/2026-11-05-checkin-capacity-baseline.md was LOAD_WEBHOOKS=0 (fixture emits, delivers none), so
# this baseline job is NOT number-for-number that document's B; it is the webhooks-on flags-off control.
# Fixture values only (the same CI-only dummies e2e.yml uses); no repository secret is needed.
# The `summary` job tabulates both reports into the run summary.
#
# `lichess: lila` (default `fixture`, today's run unchanged): each job also boots a REAL lila (lila-docker's prebuilt mono
# image: lila + MongoDB + Redis in one container, on this runner's localhost - never lichess.org) with PRODUCTION rate
# limits ON (`net.ratelimit = true`), mints LOAD_BOARDS x 2 accounts holding exactly the play grant
# (apps/web/e2e/load/lila-up.sh), and the harness puts a recording proxy at :4321 in front of it, so LICHESS_BASE_URL stays
# put and every game is played on lila. A 429 is recorded in the report (lichess.status429 / first429 / statusByPath), not
# a failure by itself. The minted tokens are masked and live under RUNNER_TEMP, never in the uploaded load-out/.
# The image is pinned by digest (lila-up.sh LILA_IMAGE_PINNED), and `up` proves lila's limiter live before any player plays:
# a spare account's sixth create to a non-follower must be a 429, or the job stops there. The summary prints both legs'
# digests and canaries.
#
# Free-text inputs reach a shell only through `env:`, and the first step of each job validates them before anything else.

on:
  workflow_dispatch:
    inputs:
      boards:
        description: "LOAD_BOARDS (100 boards = 200 players)"
        required: false
        type: string
        default: "100"
      scenario:
        description: "Burst scenario (B, B-honest, B-slow-5, B-slow-10)"
        required: false
        type: choice
        options: [B, B-honest, B-slow-5, B-slow-10]
        default: B
      policy_mix:
        description: "LOAD_POLICY_MIX: boards per division, e.g. required:64,required:64 = two 128-player divisions opened together (empty = one division)"
        required: false
        type: string
        default: ""
      lichess:
        description: "Lichess backend: fixture (the hand-written stand-in) or lila (a REAL lila on the runner, production rate limits ON)"
        required: false
        type: choice
        options: [fixture, lila]
        default: fixture

# Own group: never cancels, and is never cancelled by, e2e.yml (group e2e-*).
concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  baseline:
    name: Load harness, baseline (flags OFF)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL: disable
      AUTH_SECRET: ci-only-insecure-secret-please-change-in-prod-0123456789
      CRON_SECRET: ci-only-load-cron-secret
      DEVICE_LINK_KEK: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
      LICHESS_TOKEN_KEK: 9a8b7c6d5e4f30211203f4e5d6c7b8a99a8b7c6d5e4f30211203f4e5d6c7b8a9
      SUPABASE_JWT_SIGNING_KEY_B64: 
      SUPABASE_JWT_SECRET: ci-only-insecure-jwt-secret-please-change-in-prod-0123456789
      NEXT_PUBLIC_SUPABASE_URL: "https://stub.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_e2e_stub
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_PROD_TARGET: "1"
      STRIPE_SECRET_KEY: sk_test_ci_e2e_dummy
      STRIPE_WEBHOOK_SECRET: whsec_e2e_payments
      LOAD_OUT: ${{ github.workspace }}/load-out
    steps:
      - name: Validate the dispatch inputs
        # Before any shell uses them: `$((BOARDS * 2))` evaluates an array subscript in BOARDS as a command, so a free-text
        # input is checked as data first. Never echoed back.
        env:
          BOARDS: ${{ inputs.boards }}
          SCENARIO: ${{ inputs.scenario }}
          POLICY_MIX: ${{ inputs.policy_mix }}
          LICHESS: ${{ inputs.lichess }}
        run: |
          bad=0
          if ! [[ "$BOARDS" =~ ^[1-9][0-9]{0,3}$ ]]; then echo "::error::boards must be a whole number from 1 to 9999"; bad=1; fi
          case "$SCENARIO" in B|B-honest|B-slow-5|B-slow-10) ;; *) echo "::error::scenario must be B, B-honest, B-slow-5 or B-slow-10"; bad=1 ;; esac
          if ! [[ "$POLICY_MIX" =~ ^((required|optional|off):[1-9][0-9]*(,(required|optional|off):[1-9][0-9]*)*)?$ ]]; then
            echo "::error::policy_mix must be empty or policy:boards[,policy:boards...] with policy required, optional or off"; bad=1
          fi
          case "$LICHESS" in fixture|lila) ;; *) echo "::error::lichess must be fixture or lila"; bad=1 ;; esac
          exit $bad
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@seazn-club'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/seazn-flyway
          key: flyway-cli-10.22.0-linux-x64
      - name: Bootstrap database (Flyway migrate)
        run: npm run db:apply
      - name: Sync sport catalog from the engine registry
        run: npm run sync:sports
      - name: Build (production)
        run: npm run build --workspace apps/web
        env:
          SKIP_TYPECHECK: "1"
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: apps/web
      - name: Boot a real lila (production rate limits ON)
        if: inputs.lichess == 'lila'
        env:
          BOARDS: ${{ inputs.boards }}
          LILA_ACCOUNTS: ${{ runner.temp }}/lila-accounts.json
          LILA_OUT: ${{ github.workspace }}/load-out/lila
        run: LILA_ACCOUNT_COUNT=$((BOARDS * 2)) bash apps/web/e2e/load/lila-up.sh up
      - name: Start server
        env:
          SENTRY_DSN: ""
          NEXT_PUBLIC_SENTRY_DSN: ""
          LOG_LEVEL: info
          RELAY_DRIVERS: fake
          ENV_NAME: ci
          ONLINE_CHESS_ALWAYS: "1"
          CAPTURE_QR_V2_ALWAYS: "1"
          LICHESS_BASE_URL: http://127.0.0.1:4321
          REALTIMEKIT_BASE_URL: http://127.0.0.1:4322
          REALTIMEKIT_METER_ANY_BASE: "1"
          CLOUDFLARE_ACCOUNT_ID: e2e-rtk-account
          REALTIMEKIT_API_TOKEN: e2e-rtk-api-token
          REALTIMEKIT_APP_ID: e2e-rtk-app
          REALTIMEKIT_PLAYER_PRESET: e2e_chess_player
          REALTIMEKIT_ARBITER_PRESET: e2e_chess_arbiter
          REALTIME_PUBLISH: "off"
          AUTH_DEV_LINKS: "1"
          RESEND_API_KEY: ""
          PORT: "3391"
          # The harness teardown waits on the sweep; window deferral (default ON since plan 2) would block it.
          EXTERNAL_PLAY_WINDOW_DEFER: "0"
        run: |
          set -euo pipefail
          mkdir -p "$LOAD_OUT"
          rm -rf apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          rm -rf apps/web/.next/standalone/apps/web/public
          cp -R apps/web/public apps/web/.next/standalone/apps/web/public
          cp -R apps/web/.next/server/. apps/web/.next/standalone/apps/web/.next/server/
          # stdout is the harness's LOAD_SERVER_LOG (gate-decision and busy lines are counted from it).
          node apps/web/.next/standalone/apps/web/server.js > "$LOAD_OUT/server.log" 2>&1 &
          up=""
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3391/api/health >/dev/null; then up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then echo "server did not become healthy"; cat "$LOAD_OUT/server.log"; exit 1; fi
      - name: Run the load harness
        working-directory: apps/web
        env:
          BOARDS: ${{ inputs.boards }}
          SCENARIO: ${{ inputs.scenario }}
          POLICY_MIX: ${{ inputs.policy_mix }}
          LOAD_LICHESS: ${{ inputs.lichess }}
          LOAD_LILA_URL: http://localhost:8080
          LOAD_LILA_ACCOUNTS: ${{ runner.temp }}/lila-accounts.json
        run: |
          set +e
          case "$SCENARIO" in
            B)         LAG_MIN=0; LAG_MAX=0 ;;
            B-honest)  LAG_MIN=1; LAG_MAX=3 ;;
            B-slow-5)  LAG_MIN=5; LAG_MAX=5 ;;
            B-slow-10) LAG_MIN=10; LAG_MAX=10 ;;
            *) echo "::error::unknown scenario"; exit 2 ;;
          esac
          PLAYWRIGHT_BASE=http://localhost:3391 \
          LOAD_SWEEP_EVERY_S=300 LOAD_WEBHOOKS=1 LOAD_PRESENCE_PROOF=0 \
          LOAD_BOARDS="$BOARDS" LOAD_SCENARIO="$SCENARIO" LOAD_POLICY_MIX="$POLICY_MIX" \
          LOAD_ARRIVAL_SPREAD_S=60 LOAD_OPENED_AGO_S=250 \
          LOAD_CAMERA_LAG_MIN_S=$LAG_MIN LOAD_CAMERA_LAG_MAX_S=$LAG_MAX \
          LOAD_REPORT="$LOAD_OUT/report.json" LOAD_SERVER_LOG="$LOAD_OUT/server.log" \
          npx playwright test -c playwright.load.config.ts
          EXIT=$?
          echo "$EXIT" > "$LOAD_OUT/exit.txt"
          echo "EXIT=$EXIT"
          exit $EXIT
      - name: Collect lila's log and scrub every token from load-out
        if: always() && inputs.lichess == 'lila'
        env:
          LILA_OUT: ${{ github.workspace }}/load-out/lila
        run: |
          # The delete and the scrub run whatever `logs` says (it reds on a lila that logged no refusal all run, or on a
          # docker logs failure): the upload after this step is always(), so it must never find a token. The step still
          # fails with `logs`'s own exit.
          rc=0
          bash apps/web/e2e/load/lila-up.sh logs || rc=$?
          rm -f "$RUNNER_TEMP/lila-accounts.json"
          # Belt and braces: no lip_ token leaves the runner in an artifact, whatever wrote it. A scrub that cannot run
          # drops load-out/ rather than upload it unscrubbed.
          if [ -d load-out ]; then
            find load-out -type f -exec sed -i -E 's/lip_[A-Za-z0-9_-]+/lip_***/g' {} + \
              || { echo "::error::the token scrub failed: load-out/ is dropped, not uploaded"; rm -rf load-out; rc=1; }
          fi
          exit $rc
      - name: Upload report and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-baseline
          path: load-out/
          if-no-files-found: warn

