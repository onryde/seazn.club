name: Prod

# Flyway migrate against the PRODUCTION database, THEN deploy the app to Fly.
# Fires on a version tag (v1.2.3-style), never on a branch push — a merge to
# main only ships staging (stg.yml); production ships when someone
# deliberately cuts a release by pushing a tag. Mirrors stg.yml's shape
# (same steps, same reasoning for each), pointed at fly.toml and the PROD_*
# secrets instead of fly.stg.toml and the STAGING_* ones.
#
# NO `needs:` — same reasoning as stg.yml: the gates live in ci.yml, which
# only runs on pull_request, and a tag is cut from a commit that already
# merged through a gated PR. Trusted, not re-checked.
#
# Migration-before-deploy means every migration must be backward compatible
# with the app version still running (expand/contract) — if the migrate step
# fails, the old app keeps running untouched.
#
# NEW PIPELINE (2026-08-11): production has never been deployed by CI before
# this, and — separately from anything this file can fix — the `seazn-club-prod`
# Fly app named in fly.toml DOES NOT EXIST YET (owner-confirmed as of this
# date; see the placement #21 programme memory). `flyctl deploy` targets an
# existing app; it will fail cleanly ("app not found") on the first tag push
# until someone runs `fly apps create seazn-club-prod` (or `fly launch`) and
# sets fly.toml's documented app-level secrets via `fly secrets set`. That
# failure is safe — there is no live prod app for a bad push to damage — but
# it means this workflow is currently a no-op skeleton, not a working deploy,
# until that app exists.
#
# Separately, requires two GitHub Actions secrets that do not exist yet —
#   PROD_DATABASE_URL      — Supabase SESSION pooler URL, port 5432 (same
#                             reasoning as STAGING_DATABASE_URL: Flyway's JDBC
#                             driver doesn't get along with the transaction
#                             pooler's statement handling on 6543).
#   PROD_STRIPE_SECRET_KEY — LIVE Stripe secret key (sk_live). NOT the
#                             existing `STRIPE_SECRET_KEY` secret — that one
#                             is sk_test, used by ci.yml's live-Stripe probes.
# Add both with `gh secret set` before pushing the first release tag. Until
# PROD_DATABASE_URL exists the migrate step fails loudly; until
# PROD_STRIPE_SECRET_KEY exists the Stripe sync step skips with a warning,
# same as stg.yml does for STAGING_STRIPE_SECRET_KEY.
#
# fly.toml's NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is also still the literal
# placeholder "pk_live_REPLACE_ME" — replace it before the first real deploy,
# or checkout will build against a key that doesn't exist.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  deploy-prod:
    name: Deploy (production)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      # Serialise, don't cancel: an in-flight production rollout must not be
      # killed mid-deploy by a second tag pushed moments later. Mirrors
      # placement-prod.yml's `deploy` job.
      cancel-in-progress: false
    env:
      PROD_STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5 # scripts/flyway.sh parses DATABASE_URL with node
        with:
          node-version: 26
          cache: pnpm
      # See stg.yml's identical step for why --prod and why it's transitive
      # into @seazn/engine's own dependencies section.
      - run: pnpm install --frozen-lockfile --prod

      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/seazn-flyway
          key: flyway-cli-10.22.0-linux-x64

      - name: Pending migrations
        run: bash scripts/flyway.sh info
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Migrate production database (Flyway)
        run: bash scripts/flyway.sh migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # Sport catalog rows are GENERATED from the engine registry — new
      # sports ship as rows, not schema (v6/00). Idempotent upserts keyed by
      # sport/variant; must land before the app deploys or the division
      # builder serves a stale sport_variants catalog (known gotcha).
      - name: Sync sport catalog
        run: npm run sync:sports
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # Idempotent by design: prices matched by lookup_key, currency_options
      # re-asserted, resulting ids written into `plans` (checkout 503s when
      # unsynced, so this must land before the app). Skips with a notice
      # until the PROD_STRIPE_SECRET_KEY secret (live key) exists — a
      # missing secret must not brick every release.
      - name: Sync Stripe products/prices
        if: env.PROD_STRIPE_SECRET_KEY != ''
        run: npm run stripe:sync
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
      - name: Stripe sync skipped
        if: env.PROD_STRIPE_SECRET_KEY == ''
        run: echo "::warning::PROD_STRIPE_SECRET_KEY not set — Stripe prices not synced; checkout will 503 until 'npm run stripe:sync' runs against production."

      # The image is built HERE, on the runner, and pushed to fly's registry —
      # `flyctl deploy` then only ships a digest it already has. See stg.yml's
      # identical step for why --remote-only's Depot builder can't hold this
      # build (measured SIGKILL at the 3.83 GB Turbopack peak).
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # fly.toml's [build.args] are read by flyctl's own builder, which is no
      # longer doing the build — so they are parsed out and handed to
      # `docker build` instead. Parsed rather than duplicated into this file:
      # NEXT_PUBLIC_* vars are baked into the client bundle at build time, and a
      # copy that silently drifted from fly.toml would ship a bundle pointing
      # at the wrong Supabase/Stripe/base URL with nothing failing.
      - name: Read app name and build args from fly.toml
        id: flycfg
        run: |
          node -e '
            const fs = require("fs");
            const toml = fs.readFileSync("fly.toml", "utf8");
            const app = toml.match(/^\s*app\s*=\s*"([^"]+)"/m)?.[1];
            if (!app) { console.error("::error::no app name in fly.toml"); process.exit(1); }
            const section = toml.split(/^\s*\[build\.args\]\s*$/m)[1] ?? "";
            const args = [];
            for (const line of section.split(/\r?\n/)) {
              if (/^\s*\[/.test(line)) break;
              const m = line.match(/^\s*([A-Za-z0-9_]+)\s*=\s*"([^"]*)"\s*$/);
              if (m) args.push(m[1] + "=" + m[2]);
            }
            if (!args.length) { console.error("::error::no [build.args] in fly.toml"); process.exit(1); }
            console.log("app=" + app + ", " + args.length + " build args");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              "app=" + app + "\nargs<<FLYARGS\n" + args.join("\n") + "\nFLYARGS\n");
          '

      - name: Authenticate Docker against the fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.fly.io/${{ steps.flycfg.outputs.app }}:${{ github.sha }}
          # SENTRY_AUTH_TOKEN is a secret and stays out of fly.toml; it is
          # passed the same way flyctl passed it (--build-arg), so its exposure
          # in image history is unchanged from before.
          build-args: |
            ${{ steps.flycfg.outputs.args }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --image, so no builder is involved at all: fly pulls the digest above.
      - name: Deploy the pushed image
        run: flyctl deploy -c fly.toml --image registry.fly.io/${{ steps.flycfg.outputs.app }}:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}

      - name: Report machine count
        if: always()
        run: flyctl status --app "${{ steps.flycfg.outputs.app }}" || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
