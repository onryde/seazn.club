# One-shot: list cron Workers + schedules + observability. Delete after a green run.
name: Inspect Workers (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: List Workers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @seazn/cron-worker...
      - name: wrangler whoami + deployments
        working-directory: apps/cron-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler whoami
          echo '== deployments stg =='
          pnpm exec wrangler deployments list --env stg 2>&1 | head -40 || true
          echo '== deployments prod =='
          pnpm exec wrangler deployments list --env prod 2>&1 | head -40 || true
      - name: API scripts / settings / schedules
        working-directory: apps/cron-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-cloudflare.mjs
