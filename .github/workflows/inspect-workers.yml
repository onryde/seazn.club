# One-shot: list cron Workers + schedules + observability. Delete after a green run.
name: Inspect Workers (one-shot)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    name: List Workers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @seazn/cron-worker...
      - name: Inspect stg/prod Workers
        working-directory: apps/cron-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '== whoami =='
          pnpm exec wrangler whoami
          echo '== deployments stg =='
          pnpm exec wrangler deployments list --env stg 2>&1 | head -40 || true
          echo '== deployments prod =='
          pnpm exec wrangler deployments list --env prod 2>&1 | head -40 || true
          echo '== API scripts =='
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print("ok",d.get("success"));
[print(s.get("id"), s.get("modified_on")) for s in (d.get("result") or [])]'
          for name in seazn-cron-stg seazn-cron-prod seazn-cron; do
            echo "== settings $name =="
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${name}/settings" \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);print("ok",d.get("success"),"err",d.get("errors"));r=d.get("result") or {};print(json.dumps({"observability":r.get("observability"),"logpush":r.get("logpush"),"tags":r.get("tags")},indent=2))'
            echo "== schedules $name =="
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${name}/schedules" \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);print(json.dumps({"ok":d.get("success"),"err":d.get("errors"),"result":d.get("result")},indent=2)[:2000])'
          done
