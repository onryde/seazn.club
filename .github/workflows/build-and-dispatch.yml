# Build the app + placement images once per PR, push to GHCR (private
# packages), then hand off to onryde/seazn.club.workflow (public) to run the
# black-box suites (smoke-e2e, e2e-parallel/serial/mobile) against the pulled
# images instead of rebuilding them there.
#
# Additive: does NOT replace ci.yml's own gates/test jobs or e2e.yml — those
# keep running exactly as before. This workflow only adds the image-build +
# dispatch step. Cutting the public repo over to be the ONLY place those
# suites run is a follow-up, not part of this change.
#
# Requires (private-repo secrets, set once, not part of this diff):
#   DISPATCH_PAT — repo-scoped PAT, used to fire repository_dispatch against
#     onryde/seazn.club.workflow (GITHUB_TOKEN cannot dispatch cross-repo).
# GHCR push uses the job's own GITHUB_TOKEN (packages: write) — no extra
# secret needed for that side. The public repo pulling these PRIVATE images
# needs the package's "Manage Actions access" grant added for
# onryde/seazn.club.workflow (one-time, GHCR package settings UI) — falls
# back to a read:packages PAT if org policy blocks that grant.
name: Build images + dispatch e2e

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_IMAGE: ghcr.io/onryde/seazn-app
  PLACEMENT_IMAGE: ghcr.io/onryde/seazn-placement

jobs:
  # -------------------------------------------------------------------------
  # Fast gates — same checks as ci.yml's own `gates` job. Duplicated (not
  # `needs:` across workflows, which GitHub Actions doesn't support) so this
  # workflow can build+push+dispatch without waiting on a second workflow run.
  # -------------------------------------------------------------------------
  gates:
    name: Typecheck + lint + drift gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # typecheck, openapi:gen (+ drift check), and eslint are independent of
      # each other — backgrounded in parallel, then waited on. Each logs to
      # its own file so a failure's output isn't interleaved with the others;
      # `set -o pipefail` isn't enough here since each runs as its own bg
      # job, so exit status is captured explicitly per `wait`.
      - name: Typecheck + OpenAPI drift + eslint (parallel)
        run: |
          npx turbo run typecheck > typecheck.log 2>&1 &
          pid_tc=$!

          (npm run openapi:gen && \
            git diff --exit-code openapi/v1.json openapi/v1.public.json) > openapi.log 2>&1 &
          pid_oa=$!

          npm run lint > eslint.log 2>&1 &
          pid_lint=$!

          status=0
          wait "$pid_tc"   || { echo "::error::typecheck failed";  cat typecheck.log; status=1; }
          wait "$pid_oa"   || { echo "::error::openapi drift — run 'npm run openapi:gen' and commit"; cat openapi.log; status=1; }
          wait "$pid_lint" || { echo "::error::eslint failed";     cat eslint.log;     status=1; }
          exit $status

  # -------------------------------------------------------------------------
  # Unit tests — apps/web sharded 4-way (matches ci.yml's own `test` job
  # exactly, including the reporter/outputFile and the shard-count divisor),
  # plus engine coverage as its own unsharded job.
  # -------------------------------------------------------------------------
  test:
    name: Unit tests (apps/web) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit suite (shard ${{ matrix.shard }}/4)
        run: npm test --workspace apps/web -- --shard=${{ matrix.shard }}/"$SHARD_TOTAL" --reporter=default --reporter=json --outputFile=vitest-results-unit.json

  test-engine:
    name: Unit tests (engine coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run test:coverage --workspace packages/engine

  # Three independent jobs, all gated on [gates, test], run concurrently —
  # GitHub Actions schedules jobs with the same `needs` in parallel by
  # default, no explicit fan-out needed.
  build-app-image:
    name: Build + push app image
    needs: [gates, test, test-engine]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.APP_IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # e2e-specific build-arg profile — distinct from both fly.toml (prod)
      # and fly.stg.toml (staging). NEXT_PUBLIC_SUPABASE_URL is a stub (the
      # app never hits real Supabase in this image); the Stripe key is
      # test-mode only, matching e2e.yml's own walkthrough project.
      - name: Build + push app image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://stub.supabase.co
            NEXT_PUBLIC_SCOREPAD_HOLD_MS=3000
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_51C2ImvAy22H0xqqxi73ya0Xen6LeJG5GlRSHm7OpTnlQ2Nw1RFHt1pzJ61HyWgeQCu1IueWV7yterQK8yIUCrzeK00YnXPGvrn

  build-placement-image:
    name: Build + push placement image
    needs: [gates, test, test-engine]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.PLACEMENT_IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push placement image
        uses: useblacksmith/build-push-action@v2
        with:
          context: services/placement
          file: services/placement/Dockerfile
          push: true
          tags: ${{ env.PLACEMENT_IMAGE }}:${{ github.sha }}

  package-specs:
    name: Package black-box spec files
    needs: [gates, test, test-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Black-box test files only — never src/server, src/lib, or
      # packages/engine (smoke-db/smoke-db-usecases import those directly and
      # stay running in THIS repo; see build-and-dispatch's header comment).
      - name: Package black-box spec files
        run: |
          mkdir -p /tmp/e2e-bundle
          tar -czf /tmp/e2e-bundle/e2e-specs.tar.gz \
            apps/web/e2e \
            apps/web/playwright.config.ts \
            scripts/smoke.ts \
            scripts/smoke-sports.ts \
            package.json

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-specs-${{ github.sha }}
          path: /tmp/e2e-bundle/e2e-specs.tar.gz
          retention-days: 3

  dispatch:
    name: Dispatch to seazn.club.workflow
    needs: [build-app-image, build-placement-image, package-specs]
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DISPATCH_PAT not set — e2e/smoke-e2e will NOT run against these images. Set it with 'gh secret set DISPATCH_PAT'."
            exit 0
          fi
          gh api repos/onryde/seazn.club.workflow/dispatches \
            -f event_type=run-e2e \
            -f "client_payload[app_image]=${{ needs.build-app-image.outputs.image }}" \
            -f "client_payload[placement_image]=${{ needs.build-placement-image.outputs.image }}" \
            -f "client_payload[sha]=${{ github.sha }}" \
            -f "client_payload[run_id]=${{ github.run_id }}" \
            -f "client_payload[source_repo]=onryde/seazn.club"
