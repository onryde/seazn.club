# One-shot: put CRON_SECRET + SENTRY_DSN on seazn-cron-stg.
# Manual only. Delete this workflow after a green run.
name: Cron Worker stg secrets (one-shot)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  put-secrets:
    name: wrangler secret put (stg)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @seazn/cron-worker...
      - name: Put CRON_SECRET
        working-directory: apps/cron-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::STAGING_CRON_SECRET missing"; exit 1; fi
          printf '%s' "$CRON_SECRET" | pnpm exec wrangler secret put CRON_SECRET --env stg
      - name: Put SENTRY_DSN
        working-directory: apps/cron-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then echo "::error::STAGING_SENTRY_DSN missing"; exit 1; fi
          printf '%s' "$SENTRY_DSN" | pnpm exec wrangler secret put SENTRY_DSN --env stg
