name: E2E cache warm

# Writes the Playwright browser cache ON MAIN, so the seven e2e jobs can read
# one 261 MB entry instead of each downloading Chromium for itself.
#
# What was actually wrong here is worth recording, because the first version of
# this comment got it wrong and the wrong version was plausible. The claim was
# that nothing wrote this key on the default branch and PR-scoped caches are
# invisible across branches. The second half is true; the first half is not.
# A 261 MB `playwright-Linux-<pnpm-lock hash>` entry has sat on refs/heads/main
# since 2026-08-17, written by help-shots.yml's weekly cron, which happens to
# use a byte-identical key.
#
# The e2e jobs missed it anyway — runs 32259950122 and 32272599493 both logged
# "Cache not found for input keys: playwright-Linux-1a8dcaff…" against exactly
# that key — because they were the first runs after this repo moved to
# Blacksmith runners, whose colocated Actions cache is a SEPARATE store from
# GitHub's. The 261 MB entry was in the old one. Its last_accessed_at,
# 2026-08-19T11:15Z, minutes before the migration and never since, says so.
# The run at 04:04 that morning hit the cache and carried the label
# `ubuntu-latest`; the ones at 13:45 and 15:52 missed and carried
# `blacksmith-4vcpu-ubuntu-2404`.
#
# So that particular cold start was a one-off and would have healed itself.
# Three things that are NOT one-offs are why this file exists anyway:
#
#   * The key is a hash of pnpm-lock.yaml, and help-shots.yml only runs on
#     Mondays at 04:43 UTC. Every lockfile change re-cools the key for up to a
#     week of PRs. This job runs on exactly that change, and nothing else.
#   * e2e.yml now restores without saving, so a lockfile bump has no writer at
#     all until the next Monday cron. Making e2e.yml restore-only without
#     adding a writer would be the actual regression.
#   * Seven jobs racing one key on save is a real, observed failure — six of
#     seven logged "Failed to save: Unable to reserve cache with key
#     playwright-…" on run 32272599493. One writer cannot race itself.
#
# Depending on help-shots.yml for this would be an accident rather than a
# design: it is a screenshot job that happens to install a browser, and
# nothing stops it changing its key or its schedule.
#
on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - .github/workflows/e2e-cache-warm.yml
  workflow_dispatch:

concurrency:
  group: e2e-cache-warm
  cancel-in-progress: true

jobs:
  warm:
    name: Warm the Playwright browser cache (main scope)
    # Two vCPU, not the four every e2e job takes: this job downloads a browser
    # and writes a cache. It never builds or runs a test, and nothing here is
    # CPU-bound, so the extra cores would idle at full price.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      # Also warms the pnpm store cache in the main scope, which is why PR runs
      # already hit `node-cache-Linux-x64-pnpm-…` while missing the Playwright
      # one — that key has main-branch writers elsewhere and this one had none.
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Key and path must stay byte-identical to the restore step in e2e.yml's
      # three jobs, or this warms a cache nobody reads. On a re-run where the
      # key already exists this restores and skips the save, so the job is
      # idempotent and cheap.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # No `--with-deps`, matching e2e.yml: every dependency it installs was
      # already at the newest version on this image (run 32272599493), so it
      # only bought an apt-get update. The browser binaries are the payload.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: apps/web
