name: CI

# PULL REQUESTS ONLY. Deploys live in their own workflows now (stg.yml on
# push:main, prod.yml on a v*.*.* tag) so this file's only job is validating
# a PR's tree before it merges — it never builds or ships anything.
on:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Turborepo Remote Cache (Vercel personal scope — `turbo link` writes the team
# id to .turbo/config.json, which is gitignored, so CI has to be told).
#
# Fork PRs get an EMPTY TURBO_TOKEN because secrets are withheld from them.
# That is not an error: turbo drops to the local cache and every task still
# runs. Verified 2026-08-03 with both vars empty — 2 tasks successful.
#
# The signature key is checked on download; a mismatch is a SILENT permanent
# cache miss, not a failure. So a wrong/absent key costs speed, never
# correctness — but it also means CI will never tell you the key is wrong.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAMID: team_YHIpnOtgzPbKRRZIePMhWVtG
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # -------------------------------------------------------------------------
  # The DB-free gate used to be ONE job named "Unit + typecheck" that ran
  # typecheck, every drift gate, eslint, the apps/web suite and the engine
  # coverage+sim pass in series. Measured on run 32008189908 it was 566s — the
  # whole workflow's wall clock — and 515s of that was three steps:
  #
  #     eslint                              55s
  #     npm test --workspace apps/web      179s
  #     npm run test:coverage (engine)     281s
  #
  # (turbo typecheck was 13s on a Remote Cache hit, and all four drift gates
  # were under 3s each — they are NOT where the time is, and parallelising
  # them would have bought nothing.)
  #
  # Those three are now three jobs. Deliberately separate JOBS rather than
  # concurrent steps inside one: `ubuntu-latest` is 4 cores, apps/web's
  # typecheck peaks ~2.5 GB RSS, and both vitest invocations fork their own
  # workers — running them concurrently on one runner buys contention and
  # heap pressure, and this repo's timing-sensitive suites go red under load.
  # Separate jobs get separate 4-core runners and cannot contend at all.
  #
  # New floor is smoke-db (350s on the same run), so do not split these finer
  # expecting more wall clock — measure smoke-db first.
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # Typecheck, lint, and every drift gate. No DB, no engine coverage. ~115s.
  # -------------------------------------------------------------------------
  gates:
    name: Typecheck + lint + drift gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both workspaces in one graph-ordered pass, restored from the Remote
      # Cache when neither TS tree changed. turbo.json's globalDependencies
      # pull in scripts/** + tsconfig.scripts.json, which apps/web's typecheck
      # reads via its second `tsc -p ../../tsconfig.scripts.json` half — without
      # that, a scripts/ edit would restore a stale green.
      #
      # This step used to carry `NODE_OPTIONS: --max-old-space-size=6144`:
      # apps/web peaked ~2.8 GB against the runner's ~2 GB default V8 heap and
      # died at 2041/2088 MB. TypeScript 7 is a native Go binary, so there is no
      # V8 heap to raise — measured peak RSS is ~2.5 GB of ordinary process
      # memory. The appetite barely moved; only the cap disappeared.
      #
      # Do NOT reintroduce that flag. If it ever looks necessary again, the flag
      # is not the problem — something has fallen back to a JS compiler, and
      # that is what to go and find. toolchain.test.ts fails on any non-comment
      # line setting it, so this comment may name it plainly.
      - run: npx turbo run typecheck
      - run: npm run engine:boundary
      # v3/03 §6: retired plan tier must never reappear in UI copy.
      - name: Plan-scrub grep gate (PROMPT-32)
        run: bash scripts/check-plan-scrub.sh
      - name: OpenAPI spec drift gate (PROMPT-11)
        run: |
          npm run openapi:gen
          git diff --exit-code openapi/v1.json || {
            echo "openapi/v1.json is stale — run 'npm run openapi:gen' and commit."; exit 1; }
      # i18n gates (v17 gap W8 review). NEITHER of these ran in CI before, and
      # gen-keys.ts's own header claimed one of them did — so the two failure
      # modes below were both invisible on a PR:
      #
      #  * `i18n:check` compares the locales to EACH OTHER, so a key missing
      #    from every locale is parity-clean.
      #  * the generated union is the only thing that knows which keys EXIST,
      #    and `t()` cannot enforce it: `TKey = DictionaryKey | (string & {})`
      #    accepts any string and renders the key name at runtime. W8 shipped
      #    `pass.entry.ended.nextBody` three commits before the union caught up,
      #    with tsc, i18n:check and the full suite green throughout.
      - name: i18n key union drift + locale parity
        run: |
          npm run i18n:check
          npm run i18n:gen-keys
          git diff --exit-code apps/web/src/lib/i18n-keys.ts || {
            echo "i18n-keys.ts is stale — run 'npm run i18n:gen-keys' and commit."; exit 1; }
      # Engine schema-snapshot drift gate (#429 scope item 2). The frozen golden
      # corpora compare recorded bytes, so they red only on a state path some
      # stream WRITES; a config knob no stream sets or an enum member no seed
      # picks can be narrowed with all eleven corpora green. The committed
      # sports/**/<key>.schema.json files are taken from the DECLARATION, so
      # they cover the unexercised half, and this step is what makes them
      # load-bearing rather than decorative.
      #
      # DELIBERATELY NOT gated on the `engine-changes` filter, unlike the
      # coverage and sim-matrix steps below: those are expensive, this is ~1 s,
      # and a drift gate that skips is a drift gate that reports success. It
      # needs no DB and no build — the job-level `pnpm install` is the only
      # prerequisite, and it touches no *.golden.json (no UPDATE_GOLDEN /
      # REBASELINE_GOLDEN is involved; see packages/engine/src/testkit/GOLDEN-POLICY.md).
      #
      # `git status --porcelain`, not `git diff`: a NEW sport module's snapshot
      # is written as an UNTRACKED file, which `git diff` does not see at all.
      - name: Engine schema-snapshot drift gate (#429)
        run: |
          npm run schema:snapshot --workspace packages/engine
          drift="$(git status --porcelain -- ':(glob)packages/engine/src/sports/**/*.schema.json')"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "Engine schema snapshots are stale — run 'npm run schema:snapshot --workspace packages/engine' and commit."
            git diff -- ':(glob)packages/engine/src/sports/**/*.schema.json'
            exit 1
          fi
      # eslint gate (#344). Nothing ran lint in CI before, and `main` carried 31
      # errors for long enough that none of them were recent. BLOCKING, not
      # advisory: an advisory gate on a repo that already had 31 errors just
      # prints 32 next week.
      #
      # Errors only. The 73 warnings are deliberately not gated — clearing them
      # is a separate piece of work, and failing on them today would mean either
      # a mass rewrite in this PR or a gate nobody can keep green.
      #
      # A react-hooks/exhaustive-deps suppression should be rare and should
      # name the issue it exists for. This comment used to point at the
      # tree's one such suppression by name (#355, a ref read during render
      # on a v1 pad's live-scoring countdown) — that suppression was deleted
      # along with the rest of the v1 pads in the S13/#422 cutover, and the
      # v2 skin #355's own coverage moved onto (period-skin.tsx) needs none.
      # Most remaining suppressions carry their own inline reasoning at their
      # call site (pad-renderer.tsx:116, use-pad-pipeline.ts:1198). At least one
      # does not — pad-renderer.tsx's `skinDispatch` useMemo — so read this as
      # the standard we hold new ones to, not as a claim about every existing
      # one. Pre-existing; not introduced by the S13/#422 cutover.
      - name: eslint
        run: npx turbo run lint

  # -------------------------------------------------------------------------
  # The apps/web unit / property / grid suite, in two shards. It was 216s — 182s
  # of it this one step — and second only to smoke-e2e once #600 landed, so it
  # had to move for the floor to come down at all.
  #
  # `--shard` here, rather than the exclude-globs #600 needed for smoke-db, and
  # the difference is worth knowing: `vitest run --shard` IS honoured (verified
  # on this repo: 7 + 7 files, zero overlap, union 14) but `vitest list --shard`
  # is SILENTLY IGNORED (247 files for 1/2, for 2/2 and unsharded). smoke-db is
  # reconciled by the #339 collection guard, which is built on `vitest list`, so
  # it could not use --shard. THIS job carries no collection reconciliation, so
  # it can — and gets automatic rebalancing as files are added, with no boundary
  # constant to maintain.
  #
  # No DB and no Postgres service: this job has never had DATABASE_URL, so every
  # DB-backed suite self-skips here exactly as before. Sharding does not change
  # which suites skip, only which shard sees them.
  # -------------------------------------------------------------------------
  test:
    name: Unit tests (apps/web) ${{ matrix.shard }}/2
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false # one shard's failure must not hide the other's
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Unit suite (shard ${{ matrix.shard }}/2)
        run: npm test --workspace apps/web -- --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile=vitest-results-unit.json

      # A silently-ignored `--shard` costs nothing visible: both shards would run
      # the WHOLE suite, stay green, and just double the runner minutes. The
      # dangerous direction is the other one — a shard that selects NOTHING is
      # also green, and half the unit suite would stop running with no signal at
      # all. So bound the executed count on both sides.
      #
      # The oracle is `vitest list --filesOnly` with NO --shard, which is the
      # full set (that flag being ignored by `list` is exactly why it is usable
      # here as a total). A healthy half sits well inside 25%–75%; the window is
      # deliberately wide because vitest shards by file, and file counts say
      # nothing about balance of RUNTIME. It is a tripwire for "the flag stopped
      # working", not a balance gate.
      - name: Assert this shard ran a real half of the suite
        run: |
          set -euo pipefail
          # `|| true` because `grep -c` exits 1 on zero matches, and under
          # `pipefail` that would kill the step with an opaque failure instead of
          # the explicit "the oracle broke" message node prints below.
          total="$(cd apps/web && npx vitest list --filesOnly 2>/dev/null | grep -cE '\.(test|spec)\.[cm]?[jt]sx?$' || true)"
          node -e '
            const fs = require("fs");
            const total = Number(process.argv[1]);
            const r = JSON.parse(fs.readFileSync("apps/web/vitest-results-unit.json", "utf8"));
            const files = new Set((r.testResults || []).map(t => t.name));
            const ran = files.size;
            console.log(`shard ran ${ran} of ${total} test files (${r.numTotalTests} tests)`);
            if (!Number.isFinite(total) || total < 2) {
              console.error(`::error::could not establish a file total (got ${total}) — the oracle broke, not the shard`);
              process.exit(1);
            }
            if (ran === 0) {
              console.error("::error::this shard executed ZERO test files. Half the unit suite is not running.");
              process.exit(1);
            }
            if (ran > total * 0.75) {
              console.error(`::error::this shard ran ${ran} of ${total} files — too many for a half. --shard looks ignored, so both shards are running everything.`);
              process.exit(1);
            }
            if (ran < total * 0.25) {
              console.error(`::error::this shard ran only ${ran} of ${total} files — too few for a half.`);
              process.exit(1);
            }
          ' "$total"

      # Live-Stripe tier probe (sk_test, test-mode): confirms our plan/tier
      # amounts still round-trip real Stripe. Self-contained (no stripe:sync /
      # DATABASE_URL needed). The secret is withheld from fork PRs, so it just
      # skips there; runs on the owner's branch PRs.
      #
      # Shard 1 ONLY. It names one file explicitly, so it is not subject to the
      # shard split at all — without the guard both shards would issue the same
      # real test-mode Stripe calls, doubling live API traffic to prove the same
      # thing twice.
      - name: Live-Stripe tier probe (sk_test)
        if: matrix.shard == 1
        run: npm test --workspace apps/web -- --run src/lib/__tests__/billing-tiers.live.test.ts
        env:
          BILLING_LIVE: "1"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

  # -------------------------------------------------------------------------
  # Engine coverage gate + the bounded sim matrix — 281s and 4s respectively,
  # and the largest single step in the old combined job. Both are gated on the
  # engine actually having changed, so on an apps/web-only PR this job is just
  # its own ~35s of setup, in parallel with everything else, costing no wall
  # clock. The paths-filter stays INSIDE this job on purpose: hoisting it into
  # a separate `changes` job would make every other job wait on a barrier to
  # learn something only this job needs.
  # -------------------------------------------------------------------------
  engine:
    name: Engine coverage + sim matrix
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # paths-filter reads the PR's changed files via the API; the repo's
    # default GITHUB_TOKEN is restricted and 403s without this.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      # Engine coverage + sim matrix only run when the engine (or the
      # dependency graph) changed — most PRs touch apps/web only.
      - uses: dorny/paths-filter@v3
        id: engine-changes
        with:
          filters: |
            engine:
              - 'packages/engine/**'
              - 'pnpm-lock.yaml'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # NO placement container here, deliberately — and this note exists so the
      # idea is not retried.
      #
      # `placement-integration.test.ts` gates on PLACEMENT_SERVICE_HOST, so
      # without a service it SKIPS, and skipped code is uncovered code. Pointing
      # this job at a container does lift coverage (measured 89.97% -> 90.64%),
      # and it was tried — but it made the job RED, while the identical three
      # tests passed in placement-ci.yml's `integration` job on the same
      # commit, same image: `total=3 passed=3 failed=0 skipped=0`.
      #
      # The difference is contention. That job runs those three tests alone;
      # this one runs the whole engine suite, including the PROMPT-14
      # simulation harness at 200 divisions per sport x format. Whether the
      # solver beats greedy inside its wall is proof-time, and this is the
      # contended box.
      #
      # So the tripwire lives in the job that can hold it. That job also fails
      # if `skipped != 0`, so it cannot silently stop running — which is the
      # failure mode that would otherwise make this note dangerous.
      # Engine suite includes the PROMPT-14 simulation harness (SIM_RUNS
      # defaults to 200 divisions per sport×format when CI=true) and the
      # coverage gate (≥90% lines; 100% on core/ and tiebreakers.ts).
      - run: npm run test:coverage --workspace packages/engine
        if: steps.engine-changes.outputs.engine == 'true'

      # Sim matrix (v3/09 §3): bounded profile — every module × format ×
      # SIM_SEEDS seeds + the permanent scenario suites; emits sim-report.json.
      # A failure line prints its reproducing seed token.
      - name: Sim matrix (bounded CI profile)
        if: steps.engine-changes.outputs.engine == 'true'
        run: SIM_SEEDS=5 npm run sim:matrix --workspace packages/engine
      - name: Sim report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-report
          path: packages/engine/sim-report.json
          if-no-files-found: ignore
      - name: Simulation failure artifacts (repro with `npm run sim:replay -- <seedToken>`)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-failures
          path: packages/engine/sim-failures/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Security gate (doc 07 §4): secret scan + dependency audit. Secret leaks
  # block; the dependency audit is advisory (won't block on a pre-existing
  # transitive advisory) but stays visible.
  # -------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # advisory: action's PR-API call is flaky; findings still surface
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      # setup-node turns pnpm caching on by itself once package.json declares a
      # `packageManager` — this step passes no `cache:` input and still gets it.
      # Its POST step then tries to save the pnpm store and fails the whole job
      # with "Path Validation Error: Path(s) specified in the action for caching
      # do(es) not exist". Nothing here ever creates that directory, because this
      # job installs nothing on purpose. The audit itself had already passed; the
      # job failed after every step of its own had succeeded.
      #
      # Creating the directory is the fix that keeps "installs nothing" true. The
      # alternative — running an install just to satisfy a cache save — would
      # spend minutes to make a scan job do the thing it is deliberately not
      # doing.
      - name: Ensure the pnpm store directory exists, for setup-node's cache save
        run: mkdir -p "$(pnpm store path --silent)"
      # Reads pnpm-lock.yaml only — this job installs nothing, and must not start.
      - name: Dependency audit (high+)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  container:
    name: docker build + TS 7 musl exec
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      # The builder stage installs devDeps, so the 20 platform-conditional
      # TypeScript 7 binaries land in that layer. None of them declare a `libc`
      # field, so npm cannot filter musl from glibc: alpine gets the linux
      # binary whether or not it can execute there.
      - name: Build the builder stage
        run: docker build --target builder -t seazn-builder:ci .

      # The whole point. `docker build` runs the app build with SKIP_TYPECHECK=1
      # and never invokes tsc, so a musl-incompatible Go binary builds perfectly
      # clean and only fails at first use. Execute it here instead.
      - name: Execute the TypeScript 7 binary inside the image
        run: |
          set -euo pipefail
          VERSION=$(docker run --rm seazn-builder:ci \
            node /app/node_modules/typescript-native/bin/tsc --version)
          echo "reported: $VERSION"
          echo "$VERSION" | grep -qE '^Version 7\.' || {
            echo "::error::TS 7 binary did not execute on musl"; exit 1; }

      # A full typecheck inside the image: proves the binary not only starts but
      # reads the real project. This is the check that would have caught a
      # partially-working binary.
      - name: Typecheck inside the image
        run: docker run --rm seazn-builder:ci npx turbo run typecheck

      - name: Report image size
        run: docker images seazn-builder:ci --format '{{.Size}}'

      - name: Build the full image, including the runner stage
        run: docker build -t seazn:ci .

  # -------------------------------------------------------------------------
  # The original single "smoke" job ran its DB/Redis vitest suites AND the
  # full production build + server + e2e smoke test in one linear chain, even
  # though `npx turbo run build` touches no database at all — it was waiting
  # on ~6 unrelated steps for no real reason. Split in two so the build starts
  # immediately instead of queuing behind tests it doesn't depend on; wall
  # clock is max(job) instead of sum(job).
  #
  # Both jobs independently migrate + sync their OWN Postgres service (GH
  # Actions services are job-scoped — there is no way to share a live
  # container across jobs) and independently build the placement service
  # image (shared `cache-from/to: type=gha`, so the second build is normally
  # a cache hit, not a second real build). That duplication is the accepted
  # cost of true parallelism; each duplicated step costs seconds, not minutes.
  #
  # Both jobs also carry the FULL original env block unchanged, even where a
  # given job doesn't obviously need every var (e.g. smoke-db doesn't run
  # scripts/smoke.ts's AI fixture) — narrowing per-job risks silently
  # starving a test that reads one of these without it being obvious from
  # this file. An unused env var is free; a silently-skipped assertion is not.
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # DB + Redis vitest suites: real Postgres container -> real HTTP -> real
  # DB. Exercises the /api/v1 service layer + engine-db adapter end to end.
  # -------------------------------------------------------------------------
  smoke-db:
    name: Smoke — DB + Redis suites (Postgres container)
    runs-on: blacksmith-4vcpu-ubuntu-2404

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # A non-UTC, NON-SEASONAL session TZ (#320). Two date-boundary suites —
        # credits-period-boundary and the credits-tab #292 regression — only
        # exercise their boundary when the session TZ differs from UTC. On the
        # default UTC service one skipped outright and the other tested nothing,
        # so #292 has had zero CI coverage since it shipped. Etc/GMT-14 rather
        # than Europe/London because London is BST for half the year, and
        # coverage that depends on the season is coverage half the time.
        command: postgres -c timezone=Etc/GMT-14
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Stock Redis speaks the same protocol as Upstash (our client is ioredis
      # over REDIS_URL, not the Upstash REST SDK), so this exercises the real
      # rate-limiter path — Lua EVAL, TTL, 429 — end to end in CI.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Superuser connection so the app can `set role app_user` (RLS). Local =>
      # no SSL. Port 5432 keeps prepared statements on (not the Supabase pooler).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL: disable
      # Session signing secret (jose HS256) — CI-only dummy.
      AUTH_SECRET: ci-only-insecure-secret-please-change-in-prod-0123456789
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
      # v4 AI smoke (scripts/smoke.ts v4AiSuite): point the server's
      # Anthropic provider at the smoke-started model fixture on 4319 with a
      # non-empty dummy key, so the fixture-gated AI checks actually run in CI
      # instead of silently skipping. Mirrors e2e.yml. No real Anthropic call.
      SCHEDULING_AI_BASE_URL: "http://127.0.0.1:4319"
      AI_FIXTURE_PORT: "4319"
      ANTHROPIC_API_KEY: sk-ant-ci-smoke-fixture
      # Stripe test-mode key (sk_test) so the smoke card-attach / billing paths
      # exercise real test-mode Stripe instead of skipping (`pm: skipped …`).
      # Withheld from fork PRs (they skip); present on the owner's branch PRs.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # Job-scoped so the server under test and scripts/smoke.ts share ONE
      # value — that is the whole requirement. It is an HMAC secret between two
      # processes in this container, never a real Stripe endpoint secret, and
      # the only reader is api/webhooks/stripe. Without it passRungLSuite (v17
      # #294) cannot sign an event the server will accept and its paid Event
      # Pass leg skips — which is the one leg proving a bought rung is the rung
      # stored, credited and enforced. Mirrors e2e's whsec_e2e_payments.
      STRIPE_WEBHOOK_SECRET: whsec_ci_smoke
      # This job's HALF of src/server/usecases — see smoke-db-usecases below for
      # the partition, the measurements behind the h/i boundary, and why the cut
      # is an exclude-glob rather than `--shard`.
      #
      # Declared ONCE, at job scope, and read by BOTH the test run and its
      # reconciliation. That is the point: the reconciliation narrows the LISTING
      # by the same glob the run was narrowed by, and two hand-copied literals
      # would eventually disagree — at which point the reconciliation reports the
      # other job's files as "listed but not run", and that reads as "the gate is
      # broken" rather than "the globs drifted".
      USECASES_EXCLUDE: "**/server/usecases/__tests__/[i-z]*"

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # DO NOT hoist buildx + the placement image up here to overlap the database
      # chain. It was tried and MEASURED WORSE (run 32017294260): this job went
      # 213s -> 234s and became the workflow floor.
      #
      # The mechanism, because it is not obvious and the change looks free: all
      # three smoke jobs start at the same wall-clock moment, so hoisting the
      # image build in all of them put the three builds within 17s of each other
      # (09:52:00 / 09:52:02 / 09:52:17) and they then contended on the shared
      # `type=gha` layer cache — with `cache-to: mode=max` writing it — taking
      # 43s / 45s / 50s instead of the ~18s each they take when staggered.
      #
      # What staggers them today is exactly the thing a hoist removes: each job
      # reaches its image build after a DB chain of a different length. That is
      # load-bearing, not incidental. smoke-e2e keeps its hoist because it has a
      # 61s production build to hide the image behind and it is the only one, so
      # nothing collides.
      #
      # Flyway CLI is downloaded by scripts/flyway.sh on first use; cache it
      # per pinned version so CI doesn't re-download every run.
      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/seazn-flyway
          key: flyway-cli-10.22.0-linux-x64

      - name: Bootstrap database (Flyway migrate)
        run: npm run db:apply

      - name: Flyway migration history
        run: npm run db:info

      - name: RLS guard (every org_id table isolated)
        run: npm run check:rls

      - name: Sync sport catalog from the engine registry
        run: npm run sync:sports

      # scripts/__tests__/sync-sports.test.ts is the only test proving the
      # prune step's `is_system = true` scope — the guarantee #431 ruling 3
      # needed PROVED, not asserted (dropping a variant is not additive: a
      # stale `sport_variants` row survives forever without it). Repo-root
      # scripts have no home in either workspace's own `npm test`: both
      # packages/engine and apps/web restrict their vitest `include` to their
      # own src/**, so neither would ever collect a file under scripts/, and
      # there is no root-level vitest install (`npx vitest`/`pnpm exec
      # vitest` from the repo root both fail to resolve the binary — proved
      # locally, not assumed). Invoking packages/engine's already-installed
      # binary directly, with an EXPLICIT path argument rather than a
      # config-driven include glob, sidesteps both: vitest's config
      # auto-discovery walks up from cwd, and the repo root has no
      # vitest.config.*, so packages/engine's own restrictive one is never
      # picked up.
      #
      # That last sentence has a consequence worth spelling out, because it cost
      # a CI round trip: with no config discovered, NO `testTimeout` convention
      # is in force here and vitest's 5s DEFAULT applies — not apps/web's 30s.
      # smoke-db-shard-partition.test.ts shells out to `vitest list`, which is
      # ~1s per call locally and more on a runner sharing four cores with a
      # Postgres and a Redis container. `--testTimeout` is set HERE rather than
      # inline in the test because an inline `{ timeout }` silently overrides
      # whatever the caller passes, which is the defect behind #363 — someone
      # hits a CI timeout, passes the flag, watches it fail identically, and
      # concludes the test hangs. The test also memoises its spawns, so this
      # raises a ceiling rather than papering over repeat work.
      #
      # `--reporter=default` alongside the JSON one, matching every other test
      # step in this file. With ONLY the JSON reporter a failure here printed
      # nothing at all — just "Process completed with exit code 1" — so the log
      # could not say which test failed or why. That is what made the round trip
      # expensive rather than cheap.
      - name: Repo-root scripts tests (real Postgres)
        run: ./packages/engine/node_modules/.bin/vitest run --reporter=default --reporter=json --outputFile=vitest-results-scripts.json --testTimeout=30000 scripts/__tests__

      # src/lib is in scope alongside src/server. It used to be excluded, which
      # meant the two suites guarding the Event Pass invariant —
      # entitlements-sql-parity (SQL resolver == TS resolver) and
      # pass-scoping-guard (no enforcement site drops the competition id) —
      # plus every billing-*/entitlements-* DB suite ran in NO job at all: the
      # unit job has no DATABASE_URL, so they skipped there and read as green.
      # rate-limit.redis.test.ts and entitlements-cache-invalidation.redis.test.ts
      # are Redis-gated, so they still self-skip here and execute in the two
      # dedicated steps below, each of which owns REDIS_URL for itself alone.
      #
      # NO stray `run` positional. The workspace script is already `vitest run`,
      # so `-- run src/server src/lib` passed THREE filename filters rather than
      # a command and two paths — and the extra one matched
      # src/components/__tests__/run-your-own-cta.test.tsx and
      # src/components/v2/board/__tests__/run-elapsed.test.tsx, dragging two
      # component suites into a Postgres job that was never meant to run them
      # (187 files collected against the 185 the paths select). Measured on
      # 2026-07-29 while chasing #339.
      # --- a REAL solver for this job ----------------------------------------
      #
      # The solver is remote now (the `placement` service, over gRPC). Before
      # the cutover it was z3-as-WASM and therefore always present, so any test
      # in this job could call the engine and get a real solve.
      #
      # Without a reachable service `build.ts` catches the transport failure and
      # returns a greedy board carrying `solver_unavailable` — correct
      # behaviour, and useless for a test asserting `already_optimal` or
      # `infeasible`. Those assertions failed here on 2026-08-10 as
      # `expected 'solver_unavailable' to be 'already_optimal'`.
      #
      # Mirrors placement-ci.yml's `integration` job rather than inventing
      # a second pattern. The build is cached (type=gha) and shared with that
      # workflow, so this is usually a cache hit rather than a second build.
      # buildx is required before `build-push-action`, and easy to omit when
      # copying that step alone — this job once had no buildx, and the build
      # failed in 56s having never reached a test. placement-ci.yml's
      # `integration` job carries the same pair; `cache-from`/`cache-to:
      # type=gha` need it too.
      #
      - uses: docker/setup-buildx-action@v3
      - name: Build the placement service image
        uses: docker/build-push-action@v6
        with:
          context: services/placement
          file: services/placement/Dockerfile
          push: false
          load: true
          tags: placement-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A literal, not a repository secret — a throwaway container talking to a
      # throwaway client inside one ephemeral runner. It must nonetheless be
      # non-empty and IDENTICAL on both sides: the service refuses to start
      # without one, and `build.ts` defaults a missing secret to "", which the
      # service rejects as UNAUTHENTICATED, which folds into a greedy board. A
      # mismatch here would NOT fail loudly — it would look exactly like
      # "placement lost to greedy on merit".
      - name: Start the placement service
        run: |
          set -euo pipefail
          docker run -d --name placement-smoke -p 50051:50051 \
            -e PLACEMENT_SERVICE_SECRET=ci-smoke-secret \
            placement-service:ci

          opened=""
          for _ in $(seq 1 15); do
            if timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/50051' 2>/dev/null; then
              opened=1
              break
            fi
            sleep 1
          done
          if [ -z "$opened" ]; then
            echo "::error::placement port 50051 never accepted a TCP connection within 15s"
            docker logs placement-smoke || true
            exit 1
          fi

      # `--exclude "$USECASES_EXCLUDE"` hands src/server/usecases/[i-z]* to the
      # smoke-db-usecases job. Everything else under src/server, and all of
      # src/lib, still runs here.
      #
      # The quotes are load-bearing: unquoted, the shell glob-expands the pattern
      # against the CWD before vitest ever sees it, and on a no-match zsh errors
      # while bash passes the literal through — so it would work by accident on
      # the runner and break the day the pattern happens to match a path.
      - name: Engine-db + service-layer + lib integration tests (real Postgres)
        run: npm test --workspace apps/web -- --reporter=default --reporter=json --outputFile=vitest-results-lib-server.json --exclude "$USECASES_EXCLUDE" src/server src/lib
        env:
          # `localhost`, not 127.0.0.1 — consistent with the rest of this repo's
          # local-service conventions.
          PLACEMENT_SERVICE_HOST: localhost:50051
          PLACEMENT_SERVICE_SECRET: ci-smoke-secret

      # The solver-gated telemetry assertion used to live here. It MOVED to the
      # smoke-db-usecases job, because the file it inspects —
      # schedule-solver-telemetry.test.ts — begins with "s" and is therefore in
      # the [i-z] half that job now owns. It reads that job's results file, not
      # this one's, so leaving it here would assert on a file this job no longer
      # executes and fail with "did not run at all" on every green run.
      #
      # If the boundary letter ever changes, the assertion follows the file. It
      # fails loudly either way — "did not run at all" is a red, not a skip — so
      # this coupling cannot rot into silent non-coverage.

      # `scripts/smoke.ts` (which also needs the placement container) now runs
      # in the separate smoke-e2e job below, with its own container — so
      # nothing later in THIS job needs placement, and teardown at the end of
      # this job is just housekeeping, not a dependency the way it used to be.

      # The `src/app` suites and the DB-gated outliers MOVED to
      # smoke-db-usecases, purely to balance the two DB jobs. Measured on run
      # 32017904120 this job was 238s against that one's 161s — a 77s gap,
      # because this job carries every extra step on top of its usecases half.
      # Neither moved step needs Redis or Stripe (checked, not assumed), so the
      # move added no service and no env there.
      #
      # Read that 238-vs-161 with the variance in mind: this job's main test step
      # has measured 77s, 101s and 98s on three consecutive runs of the same
      # code. The gap is real but the exact figure is not.

      # Collection reconciliation (#339). A run is only evidence about the files
      # it collected, and collection has been observed to vary between runs with
      # identical arguments — 511 files once, 158 three times, all exit 0. This
      # compares what `vitest list` selects for these paths against what the step
      # above actually executed, and fails the job when they disagree. Costs one
      # collection pass, not a second suite run.
      #
      # It carries the SAME `--exclude` the run above did, so the listing it
      # reconciles against is this job's half and not the whole tree. Without it
      # every src/server/usecases/[i-z]* file reads as "listed but not run" — a
      # red on a correct run, which is how a gate gets deleted instead of fixed.
      # smoke-db-shard-partition.test.ts proves the two halves are still
      # exhaustive and disjoint, so nothing can fall between them unnoticed.
      #
      # The `src/app` reconciliation moved with its suite.
      - name: Vitest collection reconciliation
        run: |
          node --experimental-strip-types scripts/check-vitest-collection.ts \
            --results apps/web/vitest-results-lib-server.json \
            --exclude "$USECASES_EXCLUDE" -- src/server src/lib

      # REDIS_URL is scoped to this step only, and only to this step — never
      # job-wide. Setting it job-wide would switch the entitlement cache
      # (lib/entitlements.ts) on for the src/server suite above, whose tests
      # mutate entitlements via raw SQL without invalidating the cache — stale
      # reads, false failures.
      #
      # All three suites below are merged into one step (each already needs
      # Redis for its own reasons, so there is no isolation concern BETWEEN
      # them — only between all three and the src/server+src/lib step, which
      # this step still doesn't touch):
      #   * rate-limit.redis.test.ts — the real rate-limiter path, Lua EVAL /
      #     TTL / 429, end to end.
      #   * entitlements-cache-invalidation.redis.test.ts (v17 #287) —
      #     patchCompetition (and pass grant/refund) must bust ent:<org>:* the
      #     instant they write; with REDIS_URL unset elsewhere, cacheGet always
      #     misses and every read hits Postgres fresh, so this bug is
      #     structurally invisible without a real Redis actually going stale.
      #   * platform-fee-cache-isolation.redis.test.ts (#336) — the cached fee
      #     is namespaced by DB_SCHEMA; needs a real Redis holding a warm,
      #     cross-schema entry to catch a regression back to a single global key.
      - name: Redis-gated integration tests (rate limiter, entitlement cache, platform fee cache)
        run: npm test --workspace apps/web -- run src/lib/__tests__/rate-limit.redis.test.ts src/lib/__tests__/entitlements-cache-invalidation.redis.test.ts src/lib/__tests__/platform-fee-cache-isolation.redis.test.ts
        env:
          REDIS_URL: redis://localhost:6379

      # Live-Stripe against real test-mode Stripe (sk_test, already in the job env)
      # on the real Postgres this job runs. Sync prices first, then run ONLY the
      # CI-safe live suites: billing-tiers (self-contained) + billing-proration
      # (needs synced prices). Deliberately EXCLUDED: billing-automatic-tax (needs
      # a Stripe tax registration this account lacks) and schedule-ai-effort-ab
      # (issues real model calls). These files self-skip in the src/server+src/lib
      # step above (no BILLING_LIVE); here they run live. Skips cleanly on fork PRs,
      # where STRIPE_SECRET_KEY is withheld.
      - name: Live-Stripe integration tests (sk_test, real Postgres)
        if: env.STRIPE_SECRET_KEY != ''
        run: |
          npm run stripe:sync
          BILLING_LIVE=1 npm test --workspace apps/web -- src/lib/__tests__/billing-tiers.live.test.ts src/lib/__tests__/billing-proration.live.test.ts

      # Nothing after this needs the placement container.
      - name: Placement service logs and teardown
        if: always()
        run: |
          docker logs placement-smoke || true
          docker rm -f placement-smoke >/dev/null 2>&1 || true

  # -------------------------------------------------------------------------
  # The other half of src/server/usecases. Exists because smoke-db was the
  # whole workflow's floor at 294s and 171s of that was ONE step, whose work is
  # near-perfectly divisible: 483 timed files, 225.4s of per-file time, and the
  # slowest single file only 10.3s (run 32011729465). There is no long pole to
  # be blocked on — just one Postgres serving all of it.
  #
  # A JOB and not more vitest workers, because the bottleneck is the database,
  # not the CPU: 225.4s of file time inside a 171s wall is ~1.3x effective
  # parallelism on a 4-core runner with no worker cap set anywhere. Raising
  # workers contends harder on the same server; a second job brings a second
  # server. It also cannot share a schema with smoke-db — this repo reds on
  # schema reuse — and `services:` are job-scoped, which gives each its own.
  #
  # WHY THE CUT IS AN EXCLUDE-GLOB AND NOT `--shard`, which would need no
  # boundary letter and would rebalance itself: vitest 4.1.9 honours
  # `vitest run --shard=1/2` (verified: 7 + 7 files, zero overlap, union 14) but
  # SILENTLY IGNORES `vitest list --shard=1/2` (verified: 247 files for 1/2, for
  # 2/2, and for no shard at all). The collection reconciliation is built on
  # `vitest list`, so with --shard there is no way to ask what a shard should
  # have contained, and the #339 guard could only be kept by reconciling a union
  # across both jobs — which needs artifacts and a `needs:` barrier, and the
  # barrier's ~40s came straight back off the saving. `--exclude` is honoured by
  # BOTH (verified: 4 files -> 3 on each), so each job reconciles itself and no
  # barrier is needed. Do not "simplify" this to --shard.
  #
  # WHY h/i: measured, not guessed. src/lib (24.7s) and the non-usecases part of
  # src/server (6.2s) always run in smoke-db, so the boundary has to balance
  # 30.9s + usecases[a-h] against usecases[i-z]. Of every letter, h splits it
  # 113.8s vs 111.6s — 2.2s apart, the closest available. Recompute from a real
  # run's per-file times before moving it; the second-best boundary is 5.6s off
  # and the worst in that neighbourhood is 14.9s off.
  #
  # The two globs MUST stay exhaustive and disjoint over src/server + src/lib.
  # That is not assumed — smoke-db-shard-partition.test.ts derives both globs
  # from THIS FILE and fails if any file falls into both halves or neither. It
  # is what catches a new usecases test whose name starts outside a-z: today
  # zero do, and such a file would land in both halves, not neither.
  # -------------------------------------------------------------------------
  smoke-db-usecases:
    name: Smoke — usecases [i-z] (Postgres container)
    runs-on: blacksmith-4vcpu-ubuntu-2404

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Same non-UTC, non-seasonal session TZ as smoke-db (#320) — the
        # date-boundary suites only exercise their boundary when the session TZ
        # differs from UTC, and this job owns half of them.
        command: postgres -c timezone=Etc/GMT-14
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # No Redis. The Redis-gated suites are named file-by-file and all run in
      # smoke-db; nothing in src/server/usecases needs REDIS_URL, and setting it
      # here would switch the entitlement cache on for usecases tests that mutate
      # entitlements by raw SQL without invalidating it — stale reads, false reds.
      # That is the same reason smoke-db scopes REDIS_URL to one step, never
      # job-wide.

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL: disable
      AUTH_SECRET: ci-only-insecure-secret-please-change-in-prod-0123456789
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
      # NOT set here, deliberately, unlike smoke-db: no STRIPE_SECRET_KEY and no
      # STRIPE_WEBHOOK_SECRET. The live-Stripe suites are named file-by-file and
      # run in smoke-db; the usecases suites self-skip their live legs without a
      # key, which is what they already did in the combined job.
      #
      # This job's HALF of src/server/usecases — the complement of smoke-db's.
      # Read by both the run and its reconciliation; see smoke-db's copy for why
      # it is one variable rather than two literals.
      USECASES_EXCLUDE: "**/server/usecases/__tests__/[a-h]*"

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A REAL solver, for the same reason smoke-db needs one: without a
      # reachable service build.ts catches the transport failure and returns a
      # greedy board carrying `solver_unavailable`, which is useless to a test
      # asserting `already_optimal` or `infeasible`. This half owns
      # schedule-solver-telemetry.test.ts, so it is this job that would fail
      # silently-in-spirit without the container — see the assertion below.
      #
      # buildx first: `cache-from`/`cache-to: type=gha` need it, and the build
      # fails without ever reaching a test if it is omitted. The image is shared
      # with smoke-db, smoke-e2e, e2e.yml and placement-ci.yml through the same
      # gha layer cache, so this is a cache hit and not a fourth full build.
      #
      # DO NOT hoist these above the database chain to overlap it. Measured worse
      # (run 32017294260) — see the long note in smoke-db. In short: all three
      # smoke jobs start at the same wall-clock moment, so hoisting the image
      # build in all of them made the three builds concurrent and they contended
      # on the shared `type=gha` layer cache, 43-50s each against ~18s staggered.
      # The differing DB-chain lengths are what stagger them, and that is
      # load-bearing.
      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/seazn-flyway
          key: flyway-cli-10.22.0-linux-x64

      - name: Bootstrap database (Flyway migrate)
        run: npm run db:apply

      # `db:apply` alone is NOT a usable schema here: without sync:sports the
      # sports catalog is empty and the catalog-dependent suites fail
      # environmentally rather than on their own merits.
      - name: Sync sport catalog from the engine registry
        run: npm run sync:sports

      - uses: docker/setup-buildx-action@v3
      - name: Build the placement service image
        uses: docker/build-push-action@v6
        with:
          context: services/placement
          file: services/placement/Dockerfile
          push: false
          load: true
          tags: placement-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container name differs from smoke-db's `placement-smoke`: these are
      # separate runners so a collision is impossible, but a distinct name keeps
      # the teardown logs attributable when both jobs' output is read together.
      #
      # The secret must be non-empty and IDENTICAL on both sides. build.ts
      # defaults a missing secret to "", which the service rejects as
      # UNAUTHENTICATED, which folds into a greedy board — a mismatch would NOT
      # fail loudly, it would look exactly like "placement lost to greedy".
      - name: Start the placement service
        run: |
          set -euo pipefail
          docker run -d --name placement-usecases -p 50051:50051 \
            -e PLACEMENT_SERVICE_SECRET=ci-usecases-secret \
            placement-service:ci

          opened=""
          for _ in $(seq 1 15); do
            if timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/50051' 2>/dev/null; then
              opened=1
              break
            fi
            sleep 1
          done
          if [ -z "$opened" ]; then
            echo "::error::placement port 50051 never accepted a TCP connection within 15s"
            docker logs placement-usecases || true
            exit 1
          fi

      # Quoted `"$USECASES_EXCLUDE"` — unquoted, the shell glob-expands the
      # pattern against the CWD before vitest sees it.
      - name: usecases [i-z] integration tests (real Postgres)
        run: npm test --workspace apps/web -- --reporter=default --reporter=json --outputFile=vitest-results-usecases.json --exclude "$USECASES_EXCLUDE" src/server/usecases
        env:
          PLACEMENT_SERVICE_HOST: localhost:50051
          PLACEMENT_SERVICE_SECRET: ci-usecases-secret

      # MOVED here from smoke-db with the file it inspects. The solver-dependent
      # tests gate on PLACEMENT_SERVICE_HOST (`HAS_SOLVER` in
      # schedule-solver-telemetry.test.ts). A gate that is never asserted is how
      # coverage disappears silently: if the container failed to start, or the env
      # var were dropped, those tests would SKIP and this job would still be green
      # while testing nothing.
      #
      # So assert they ran. A skip here is a failure, not a pass.
      - name: Assert the solver-dependent telemetry tests actually ran
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            // apps/web/, NOT the repo root: `--outputFile` is resolved relative
            // to the WORKSPACE vitest runs in, and this job invokes it via
            // `npm test --workspace apps/web`. Reading it from the root was an
            // ENOENT that failed this step while the suite it checks had passed.
            const r = JSON.parse(fs.readFileSync("apps/web/vitest-results-usecases.json", "utf8"));
            const f = (r.testResults || []).find(t => t.name.includes("schedule-solver-telemetry.test.ts"));
            if (!f) { console.error("::error::schedule-solver-telemetry.test.ts did not run at all. It begins with s, so it belongs to this jobs [i-z] half — if the boundary letter moved, this assertion moves with the file."); process.exit(1); }
            const all = f.assertionResults || [];

            // These FOUR gate on HAS_SOLVER and must actually PASS — a skip
            // here means the container never got reached, which is the silent
            // coverage loss this step exists to catch.
            //
            // "infeasible proof" JOINED this set in B5 (#526), and the way it
            // joined is worth keeping. It used to be `it.skip`, unconditional
            // on HAS_SOLVER, guarded by a separate assertion that it was STILL
            // skipped — so that an accidental un-skip could not silently change
            // what this gate covers. That guard fired exactly as designed: B5
            // made the test pass, and the job went red with "no longer skipped
            // (status: passed)" rather than quietly widening. Deleting a skip is
            // only half the change; the gate that tracks the skip is the other.
            //
            // NO APOSTROPHES ANYWHERE IN THIS SCRIPT. The whole block is a
            // single-quoted shell argument to `node -e`, so one apostrophe in a
            // COMMENT closes the string early and the step dies with exit 126
            // before node parses a byte. Cost a CI round trip to find, because
            // 126 looks like a permissions problem, not a quoting one.
            const mustPass = all.filter(a =>
              /already_optimal|without booting the z3 WASM|polish never moves|infeasible proof/.test(a.fullName));
            const notPassed = mustPass.filter(a => a.status !== "passed");
            console.log(`solver-gated telemetry tests: ${mustPass.length} found, ${mustPass.filter(a => a.status === "passed").length} passed`);
            if (mustPass.length < 4) {
              console.error(`::error::expected 4 solver-gated telemetry tests, found ${mustPass.length} — a rename or a lost gate`);
              process.exit(1);
            }
            if (notPassed.length) {
              console.error("::error::these gated tests did not pass (a SKIP means the placement service was not reached, not that they are optional): " + notPassed.map(a => `${a.fullName} [${a.status}]`).join("; "));
              process.exit(1);
            }
          '

      # --- moved here from smoke-db, to balance the two DB jobs ----------------
      #
      # smoke-db was 238s against this job's 161s on run 32017904120, because it
      # carried every extra step on top of its own usecases half. These two need
      # neither Redis nor Stripe — checked rather than assumed: the src/app
      # suites touch Stripe only in source-text assertions, and capture.test.ts's
      # AI block is `skipIf(!CAPTURING || !HAS_DB)` with CAPTURE_AI_DEMO unset in
      # both jobs — so they moved without this job gaining a service or a secret.
      #
      # DB-gated suites that live OUTSIDE src/server / src/lib / src/app, and so
      # were selected by no step in either DB job and skipped in the unit job for
      # want of DATABASE_URL — i.e. they ran nowhere, and reported green by
      # reporting nothing. Found 2026-08-10.
      #
      # Named FILE BY FILE, deliberately. Adding `src/components` or `src/demo`
      # as a path would drag every pure component suite in those trees into a
      # Postgres job that was never meant to run them — the same over-selection
      # that once cost 187-vs-185 files on 2026-07-29. `drift.test.ts` beside
      # these is deliberately NOT DB-gated and already runs in the unit job;
      # pulling it in would be that mistake in miniature.
      #
      # capture.test.ts is here for ONE of its three blocks: its `capture a real
      # architect run` describe also needs CAPTURING, which is unset, so that
      # half still skips. The block that runs is the one its own banner calls
      # "The guard — always on" — which was not on, in any job, until this step.
      #
      # db-suite-ci-wiring.test.ts fails if a new DB-gated suite appears outside
      # those three trees without a line here, so this list cannot silently rot.
      # It is how capture.test.ts was found, after the first draft listed only
      # the other two. That guard reads ci.yml as a whole and does not care WHICH
      # job holds the line, which is what makes this move safe.
      - name: DB-gated suites outside src/server|lib|app (real Postgres)
        run: npm test --workspace apps/web -- --reporter=default --reporter=json --outputFile=vitest-results-outliers.json src/components/__tests__/upgrade-gate-pass-features.test.ts src/demo/ai-templates/__capture__/__tests__/seeds.test.ts src/demo/ai-templates/__capture__/capture.test.ts

      # The DB-gated suites under src/app. src/lib is NOT repeated here — and
      # note the original reason still holds under the split, for a different
      # cause: running src/lib in two steps of ONE job shares one migrated schema
      # across two passes, and a suite writing a fixed stripe_customer_id
      # (billing-pass-financial-trace) then collides with its own first pass under
      # V314's partial unique index. src/lib now lives in smoke-db, a separate
      # job with a separate Postgres, so there is no shared schema at all.
      #
      # pass-scoping-guard.test.ts is no longer excluded: the Event Pass scoping
      # sweep it tracked has landed, so it passes and runs with the rest.
      - name: Service-layer integration tests outside src/server (real Postgres)
        run: npm test --workspace apps/web -- --reporter=default --reporter=json --outputFile=vitest-results-app.json src/app

      # Same #339 guard smoke-db carries, over this job's half. The first call is
      # narrowed by the SAME glob the usecases run above used, or every [a-h]
      # file reads as "listed but not run" — a red on a correct run. The src/app
      # call moved here with its suite and needs no glob: that tree is not split.
      - name: Vitest collection reconciliation
        run: |
          node --experimental-strip-types scripts/check-vitest-collection.ts \
            --results apps/web/vitest-results-usecases.json \
            --exclude "$USECASES_EXCLUDE" -- src/server/usecases
          node --experimental-strip-types scripts/check-vitest-collection.ts \
            --results apps/web/vitest-results-app.json -- src/app

      - name: Placement service logs and teardown
        if: always()
        run: |
          docker logs placement-usecases || true
          docker rm -f placement-usecases >/dev/null 2>&1 || true

  # -------------------------------------------------------------------------
  # Build + serve + e2e smoke: production build against a REAL Postgres and a
  # REAL placement service, then hit the running server the way a browser
  # would. This job's own Postgres is separate from smoke-db's — see the
  # header comment above smoke-db for why. No Redis service: neither "Start
  # server" nor "Run smoke test" ever set REDIS_URL, so the app under test
  # already ran without Redis in the original combined job too — the rate
  # limiter degrades to its no-Redis fallback, same as before this split.
  # -------------------------------------------------------------------------
  smoke-e2e:
    name: Smoke — build + server + e2e (Postgres container)
    runs-on: blacksmith-4vcpu-ubuntu-2404

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        command: postgres -c timezone=Etc/GMT-14
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL: disable
      AUTH_SECRET: ci-only-insecure-secret-please-change-in-prod-0123456789
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
      SCHEDULING_AI_BASE_URL: "http://127.0.0.1:4319"
      AI_FIXTURE_PORT: "4319"
      ANTHROPIC_API_KEY: sk-ant-ci-smoke-fixture
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: whsec_ci_smoke

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/seazn-flyway
          key: flyway-cli-10.22.0-linux-x64

      # Persist the compiler cache between runs so the production build only
      # pays for what changed (nextjs.org/docs/pages/guides/ci-build-caching).
      # Source-hash key with a lockfile restore-key: exact hit on unchanged
      # source, warm partial cache otherwise.
      #
      # MOVED UP, with buildx and the two long builds below it, so the database
      # chain runs UNDERNEATH them rather than ahead of them. Restores stay in
      # the foreground: they are ~2s, and a backgrounded actions/cache loses its
      # outputs (measured — see e2e.yml's note on the placement image).
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.js', 'apps/web/src/**/*.jsx', 'apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: docker/setup-buildx-action@v3

      # Backgrounded. Nothing before the `wait:` below reads this image, and at
      # 17s it was pure serial time in front of a 61s build.
      - name: Build the placement service image
        id: image
        background: true
        uses: docker/build-push-action@v6
        with:
          context: services/placement
          file: services/placement/Dockerfile
          push: false
          load: true
          tags: placement-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backgrounded, and the long pole of this job's setup at 61s. The DB chain
      # below (migrate, RLS guard, sport sync, Stripe sync — ~20s together) now
      # runs while this compiles instead of before it.
      #
      # On a cache hit turbo restores apps/web/.next/** (minus .next/cache,
      # which the actions/cache step above owns) — including the standalone
      # tree the "Start server" step copies .next/static into.
      #
      # SKIP_TYPECHECK is declared in turbo.json's `build.env`, so a run with
      # it set hashes differently from one without: a cached build can never
      # be silently reused across the type-checked / not-type-checked split.
      - name: Build (production)
        id: build
        background: true
        run: npx turbo run build
        env:
          # tsc gate already ran in the gates job — don't type-check twice.
          SKIP_TYPECHECK: "1"

      - name: Bootstrap database (Flyway migrate)
        run: npm run db:apply

      - name: RLS guard (every org_id table isolated)
        run: npm run check:rls

      # Must land before the app deploys/serves or the division builder reads
      # a stale sport_variants catalog (known gotcha) — same reasoning as
      # stg.yml/prod.yml's identical step.
      - name: Sync sport catalog from the engine registry
        run: npm run sync:sports

      # This job's OWN DB has no synced Stripe prices yet — smoke-db's
      # `stripe:sync` (in its "Live-Stripe integration tests" step) only
      # populates smoke-db's own database, a separate Postgres instance in a
      # separate job. Without this, checkout paths in the smoke suite below
      # would 503 exactly the way stg.yml's comment describes for a real
      # deploy. Skips cleanly on fork PRs, where STRIPE_SECRET_KEY is withheld.
      - name: Sync Stripe products/prices
        if: env.STRIPE_SECRET_KEY != ''
        run: npm run stripe:sync

      # The setup phase's join. Everything past here needs what the two
      # background steps produce: the container needs the image, and both
      # "Start server" and the smoke run need .next/standalone. A background
      # step's FAILURE also surfaces here rather than where it happened, so a red
      # on this step means "read the interleaved log above", not "the wait broke".
      - name: Wait for the placement image and the production build
        wait: [image, build]

      - name: Start the placement service
        run: |
          set -euo pipefail
          docker run -d --name placement-smoke -p 50051:50051 \
            -e PLACEMENT_SERVICE_SECRET=ci-smoke-secret \
            placement-service:ci

          opened=""
          for _ in $(seq 1 15); do
            if timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/50051' 2>/dev/null; then
              opened=1
              break
            fi
            sleep 1
          done
          if [ -z "$opened" ]; then
            echo "::error::placement port 50051 never accepted a TCP connection within 15s"
            docker logs placement-smoke || true
            exit 1
          fi

      # Smoke runs against a PRODUCTION build, not `next dev`. The dev server
      # restarts itself once used heap crosses 80% of its V8 limit (which
      # `next dev` pins to HALF the machine's RAM — ~3.5 GB on the 7 GB
      # runner, vs ~16 GB on a dev laptop, which is why this only ever died
      # in CI). Near that ceiling Turbopack's on-demand route compiles also
      # started 404ing transiently. The standalone server has neither the
      # watchdog nor per-request compiles — and it's what production runs.

      # The Next.js cache restore and the production build used to sit here.
      # Both MOVED UP above the database chain so that chain runs underneath the
      # build rather than in front of it; the build is now a `background:` step
      # joined at the `wait:` above.

      # Start the server PRODUCTION runs (#356). `next start` does not serve an
      # `output: standalone` build at all — it warns and serves the
      # non-standalone tree, so this job was exercising a serving path fly.toml
      # never uses. It only appeared to work because the untraced `.next` tree
      # is still on disk from the build step one line above.
      #
      # `.next/static` is NOT copied into the standalone output. Without it the
      # server answers /api/health and page HTML 200 while every
      # /_next/static/*.js 404s — the app renders and then does nothing (#342).
      # The `rm -rf` is load-bearing: `cp -R src dst` with dst present copies
      # INTO it, so a re-run yields .next/static/static/….
      #
      # Path note: outputFileTracingRoot is the monorepo root, so the server is
      # at .next/standalone/apps/web/server.js — not the .next/standalone/
      # server.js that Next's own warning names.
      - name: Start server
        # The SERVER is what talks to the solver — `build.ts` runs server-side,
        # so these must be in the server's environment, not the test process's.
        # Putting them only on the `Run smoke test` step would leave the app
        # dialling the production default (`placement.flycast:50051`),
        # unreachable from a runner, and every board would quietly come back
        # greedy while smoke reported on it.
        env:
          PLACEMENT_SERVICE_HOST: localhost:50051
          PLACEMENT_SERVICE_SECRET: ci-smoke-secret
        run: |
          rm -rf apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          node apps/web/.next/standalone/apps/web/server.js > dev-server.log 2>&1 &
          echo "waiting for server…"
          up=""
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              echo "server up after ${i}s window"; up=1; break
            fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "server did not become healthy"; cat dev-server.log; exit 1
          fi
          # Health says the process is listening; it does NOT say the app can
          # hydrate. Prove one real chunk serves, or a mis-staged static tree
          # reaches the suite as product-shaped failures.
          chunk=$(ls apps/web/.next/static/chunks/*.js 2>/dev/null | head -1)
          if [ -z "$chunk" ]; then
            echo "no built chunks found — build output is not where expected"; exit 1
          fi
          asset="/_next/${chunk#apps/web/.next/}"
          if ! curl -sf "http://localhost:3000$asset" >/dev/null; then
            echo "static asset $asset 404s — standalone tree not staged"
            cat dev-server.log; exit 1
          fi
          echo "static assets serve ($asset)"

      - name: Run smoke test
        run: npm run test:smoke

      # The Playwright UI e2e suite moved to its own workflow (e2e.yml): it
      # runs on pushes to main, or on demand against a PR by number.

      - name: Dev server log (on failure)
        if: failure()
        run: cat dev-server.log || true

      - name: Placement service logs and teardown
        if: always()
        run: |
          docker logs placement-smoke || true
          docker rm -f placement-smoke >/dev/null 2>&1 || true
