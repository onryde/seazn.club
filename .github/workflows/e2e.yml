name: E2E

# Playwright UI e2e suite, split out of the CI smoke job so PRs stay fast.
# Runs automatically on push to main ONLY (2026-08-26) — a PR sitting on a
# feature branch gets no e2e signal until it merges. workflow_dispatch is the
# escape hatch for a feature branch that needs a run before then; its `pr`
# input lets you target a specific PR number instead of main.
#
# Split into three independent jobs — e2e-parallel / e2e-serial / e2e-mobile —
# instead of one job chaining `playwright test --project=X && ... && ...`.
# That `&&` chain meant a `parallel` failure silently skipped `serial` and
# `mobile` entirely: they never ran, and their absence read as "not
# applicable" rather than "untested". Separate GitHub Actions jobs have no
# such chain — each runs and reports regardless of the others' outcome.
#
# `e2e-mobile` also runs the FIVE width/device projects (mobile-320/360/430,
# tablet-768/834) that `playwright.config.ts` has always defined but that no
# workflow ever invoked — confirmed by grepping every workflow file for their
# project names before that change; only mobile-se (375) and mobile-14 (390)
# ever ran in CI. AGENTS.md calls the seven-width matrix "the enforcement
# backstop"; it was 2 of 7 in practice.
#
# The seven are now spread over THREE matrix jobs (3 + 2 + 2 widths), each
# still running its own group with `--workers=1`. Read the two constraints
# separately, because an earlier version of this comment conflated them and
# concluded "deliberately NOT one job per width":
#
#   * WITHIN a job, the widths must stay serialized. `fullyParallel: true` is
#     global, so Playwright would otherwise run projects concurrently, and all
#     seven exercise mobile.spec.ts against the SAME org minted by that job's
#     `setup` project — the documented "7 width projects race each other over
#     ONE org" flakiness (a settings-rename hangs 60s on a disabled Save under
#     contention). `--workers=1` is therefore still mandatory per job and must
#     not be raised.
#   * ACROSS jobs there is no such race at all, for the reason the next
#     paragraph already gives: `services:` are job-scoped, so each matrix leg
#     migrates its own Postgres and mints its own `setup` org. Three legs are
#     three isolated orgs, not three contenders for one.
#
# Why three and not seven: measured on run 32008189967 this job was 508s, of
# which the Playwright step alone was 362s (7 projects x 21 tests at ~2.5s,
# serialized). Setup is ~125s and is paid per leg. Three legs put the longest
# leg at ~280s, which lands just under `e2e-parallel`'s slowest shard (305s on
# the same run) — and that shard is the workflow's floor, so splitting finer
# buys NOTHING in wall clock while paying setup seven times over. If
# `e2e-parallel` ever gets faster, revisit the leg count against its new
# slowest shard rather than against this job in isolation.
#
# That last sentence has now come due, and this paragraph is kept above rather
# than rewritten because its ARITHMETIC is the part that expired, not its
# method. `e2e-parallel` no longer shards by test count: its slowest leg is
# predicted at ~234s (see that job's own comment), where phones-small measured
# 244s on run 32272599493. THIS job is therefore the workflow's floor now, and
# it is the leg count here — not there — that is worth revisiting next. Do it
# the same way: against the other jobs' slowest leg, never against this one in
# isolation.
#
# Each job independently migrates its own fresh Postgres and mints its own
# `setup`-project org — GitHub Actions `services:` are job-scoped, so there
# is no live database or server to share across jobs (see ci.yml's
# smoke-db/smoke-e2e split for the same reasoning). That duplication also
# means the mobile job's org is now structurally isolated from parallel's and
# serial's too, not just from its own seven widths.
#
# All three jobs run against a PRODUCTION build, never `next dev`: `next dev`
# pins its V8 heap to half the runner's RAM and restarts itself past ~80% use
# (with transient 404s from Turbopack's on-demand compiles as it nears the
# ceiling) — flaky under a full Playwright run. `next start` has neither the
# watchdog nor per-request compiles, and is what production runs anyway. The
# compiler cache is persisted between runs so the build only pays for changes.
#
# Because production builds never dev-expose `login_url`, every job sets
# E2E_PROD_TARGET=1: the auth helpers mint login tokens straight in the DB
# (the local Postgres service each job starts) and skip the specs that assert
# dev link exposure. Runs leave TAG-prefixed e2e users/orgs behind in that
# job's own throwaway DB.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to run the e2e suite against (empty = main)"
        required: false
        type: string

concurrency:
  group: e2e-${{ inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  # `runs-on` for every job reads the E2E_RUNNER repo variable (Settings ->
  # Secrets and variables -> Actions -> Variables), so the runner can change
  # without editing this file. Defaults to ubuntu-latest when unset. CI jobs
  # use CI_RUNNER separately — do not share the label.
  # ---------------------------------------------------------------------
  # Specs that only touch state they create (own competitions/divisions) —
  # safe at several workers, tests within a file too. See
  # playwright.config.ts's `parallel` project.
  # ---------------------------------------------------------------------
  e2e-parallel:
    name: Playwright e2e — ${{ matrix.group }} (Postgres container)
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    # No job here had a timeout, so GitHub's 360-minute default applied. Over
    # the 100 runs to 2026-08-19, 15 e2e jobs ran past 30 minutes and burned
    # 46% of this workflow's entire runner time (2,499 of 5,403 minutes); five
    # of them ran the full 360 before being killed (runs 32157900228,
    # 32084592754). A hung Playwright job is not a slow job — it never
    # finishes, and on a 4-vCPU runner six hours of it bills 1,440 minutes,
    # more than a normal month of this whole workflow. p95 is ~7 minutes.
    timeout-minutes: 20

    # Sharded because this project is the wall-clock floor of a PR. Measured on
    # run 31691106751: 8.2 min total, of which the Playwright step alone was
    # 5.0 — and on a bad run the step reached 15.6 min while setup stayed flat.
    # Tests dominate, and they dominate WORST on exactly the runs that hurt.
    #
    # Sharding rather than raising `workers` (playwright.config.ts pins CI to
    # 2) on purpose: `ubuntu-latest` is 4 cores, already shared with the Next
    # server and a Postgres service container. Adding workers buys contention,
    # and both failures seen on 2026-08-13 were TIMEOUTS (60s and 240s), which
    # contention makes more likely, not less. Shards get their own runners, so
    # each keeps the same 2 workers on its own 4 cores.
    #
    # The cost is real and worth stating: every shard repeats the whole setup
    # — Flyway migrate, sport sync, production build, placement image, server
    # start (~3.2 min warm). Three shards spend ~3x those runner-minutes to buy
    # back wall clock. Expect ~5 min typical and ~8 min on a bad run, against
    # 8.2 and 15.6 today. If setup ever grows past the test time, revisit: the
    # trade inverts.
    #
    # Each shard is a separate JOB, so each gets its own Postgres service and
    # its own `auth.setup` orgs — no cross-shard state, which is what makes
    # this safe for a project whose tests share an org within a run.
    #
    # Still three jobs, but no longer `--shard=N/3`. Playwright shards by TEST
    # COUNT over a contiguous, file-ordered slice, and it has no idea what a
    # test costs: e2e/scorepad-v3-cricket.spec.ts alone is ~90s of the
    # project's ~368s and sits in the alphabetical tail, so shard 3/3 measured
    # 176s against 89s and 87s (run 32272599493), 170s against 87s and 77s
    # (32269332414), and 227s against 147s and 112s (32214432854). That shard,
    # not e2e-mobile, was this workflow's wall-clock floor.
    #
    # So: one leg for the expensive files, two legs sharding everything else.
    # Predicted 128 / 126 / 115s against a perfect-split floor of 123s. The
    # slice is selected in playwright.config.ts via E2E_PARALLEL_SLICE, where
    # "rest" is a catch-all — a new spec joins the sharded remainder on its
    # own, and only a file named in PARALLEL_HEAVY can leave it. Read that
    # file's comment, which carries the derivation, before changing the split.
    #
    # Why not four legs or more: at ~128s + ~106s setup these land at ~234s,
    # just under where e2e-mobile's phones-small leg already sits (244s). The
    # floor moves there, so a finer split buys nothing and pays setup again —
    # the same arithmetic this file's header applies to e2e-mobile, run in the
    # other direction.
    strategy:
      fail-fast: false # one leg's failure must not hide another's
      matrix:
        # `slug` is the artifact-safe name, for the same reason e2e-mobile
        # carries one: upload-artifact@v4 rejects "/" and fails the job on a
        # duplicate name.
        include:
          - group: parallel 1/2
            slug: parallel-1
            project: parallel
            slice: rest
            args: --shard=1/2
          - group: parallel 2/2
            slug: parallel-2
            project: parallel
            slice: rest
            args: --shard=2/2
          - group: parallel heavy
            slug: parallel-heavy
            project: parallel
            slice: heavy
            args: ""
          # Whole matches played by hand, through the decider — the suite's
          # product-level proofs (#667, #670). Its own leg so a failure reads
          # as "a scorer cannot finish a match" rather than "a shard broke",
          # and so its ~174s does not sit on top of the sharded remainder.
          # `slice` is irrelevant to this project and left empty deliberately:
          # E2E_PARALLEL_SLICE only selects between the parallel project's own
          # halves, and setting it here would imply otherwise.
          #
          # `--workers=3` overrides playwright.config.ts's global `CI ? 2 : 4`
          # for THIS leg only (workers is not a per-project option, so the
          # override has to come from the command line). Measured on the run
          # that prompted it: the step took 483s against the ~174s the config
          # comment budgets, and 153s of that — 32% — was a TAIL running 3 -> 2
          # -> 1 test wide. Playwright dispatches files in discovery order and
          # the three most expensive specs (tabletennis-match, tennis-mtb,
          # volleyball-match, each a single unsplittable test) sort LAST
          # alphabetically, so they start last and drain one after another.
          # Ten of the eighteen files hold exactly one test, so the scheduling
          # unit is effectively the file and two workers cannot pack around
          # them.
          #
          # Three workers is chosen against the three long files specifically:
          # it lets them run CONCURRENTLY instead of serially, which collapses
          # that tail to roughly the longest of them. It is also the honest
          # ceiling here — the runner is `ubuntu-latest` (4 vCPUs) and shares
          # those 4 vCPUs with Postgres and the standalone Next server, so 4 workers
          # would contend with the server under test and buy flake rather than
          # speed.
          - group: walkthrough
            slug: walkthrough
            project: walkthrough
            slice: ""
            args: --workers=3

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # No Redis on purpose: without REDIS_URL the rate limiter is inert
      # (lib/rate-limit.ts), so the suite's magic-link logins can't trip the
      # fail-closed 5-per-5-min email budget.

    env:
      # Superuser connection so the app can `set role app_user` (RLS). Local =>
      # no SSL. Port 5432 keeps prepared statements on (not the Supabase pooler).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL: disable
      # Session signing secret (jose HS256) — CI-only dummy.
      AUTH_SECRET: ci-only-insecure-secret-please-change-in-prod-0123456789
      # Public realtime-token minting (mintPublicFixtureToken, lib/realtime.ts).
      # Prefer ES256 (project JWKS shape); HS256 remains as fallback for older
      # helpers. CI-only dummy keypair — not a real Supabase signing key.
      SUPABASE_JWT_PRIVATE_KEY: '{"kty":"EC","x":"JkXLFTKBFmcNZj3uxo9IG_ChGy4qe0O8uRjgI8iyF1Q","y":"_2CkI9u7EVulWYy58pcUwZpiFBhC5qba8xZTrHfVi0s","crv":"P-256","d":"enLYu03-bP8O-YTy5DjWbt8Cl2ocm2KorNJlBD5bUzY","alg":"ES256","kid":"e2e-ci-es256","use":"sig"}'
      SUPABASE_JWT_SECRET: ci-only-insecure-jwt-secret-please-change-in-prod-0123456789
      # x-cron-secret bearer for /api/cron/registrations (RS012's walkthrough
      # drives the sweep directly, apps/web/e2e/walkthrough/rs012-solo-signup-
      # pool.spec.ts:405). CI-only dummy, same convention as AUTH_SECRET —
      # this job's server/DB are ephemeral, so it needs no relation to the
      # real `secrets.CRON_SECRET` registrations-sweep.yml uses against
      # staging/prod. Server and Playwright process both read it from this
      # one job-level var, same as every other CI-only credential here.
      CRON_SECRET: ci-only-e2e-cron-secret-0123456789
      # Stub, not empty: publicStorageUrl("") hides every badge/crest, making
      # logo assertions untestable. No real Supabase call rides on it in e2e.
      NEXT_PUBLIC_SUPABASE_URL: "https://stub.supabase.co"
      NEXT_TELEMETRY_DISABLED: "1"
      # Production build → no dev-exposed `login_url`, so the auth helpers mint
      # login tokens straight in the Postgres service above and skip the specs
      # that assert dev link exposure.
      E2E_PROD_TARGET: "1"
      # The v3 scoring pad soft-commits ONLY when an enrichment dock has chips
      # (usesSoftCommit). Empty-dock taps and `*.clock` submit immediately. When
      # a hold DOES apply, the event enters the durable queue at once but is not
      # SENT for queue.ts's HOLD_MS, and a spec that polls the ledger has to wait
      # that window out per tap. Shipped is 5s (was 12s; owner-ruled), which puts
      # the walkthrough specs — badminton alone taps sixteen rallies — past their
      # 180s budget. 3s here, set at JOB level so the identical value reaches
      # both the production BUILD (NEXT_PUBLIC_* is substituted into the client
      # bundle at build time, so the pad in the browser holds for 3s) and the
      # Playwright runner (which imports queue.ts to derive its own waits from
      # the same number). Setting it on only one of those two would leave the
      # specs racing a window the browser is not using.
      #
      # queue.ts's `resolveHoldMs` falls back to the SHIPPED default for anything
      # unusable, so a typo here slows this leg down rather than turning the
      # hold off — and the shipped value keeps its own floor test, which is
      # pinned on the default and is therefore untouched by this override.
      NEXT_PUBLIC_SCOREPAD_HOLD_MS: "3000"
      # Payments-hardening e2e (payments-hardening.spec.ts): signed synthetic
      # webhooks hit the REAL /api/webhooks/stripe route. constructEvent needs a
      # non-empty STRIPE_SECRET_KEY (any value — signature verification uses the
      # webhook secret) and the known webhook secret to sign against. CI-only
      # dummies; no real Stripe call is made (checkout still 503s on unsynced
      # prices, so the Stripe-gated billing specs stay skipped as before).
      # The walkthrough leg needs a REAL test key: it drives an actual hosted
      # checkout on checkout.stripe.com, which a dummy cannot reach. Every
      # other leg keeps the dummy, so nothing else gains a Stripe dependency.
      # Mapped through `env` rather than read as `secrets.*` inside a step
      # `if:` — the same shape registrations-sweep.yml uses, because the
      # secrets context is not dependable in step-level conditions.
      STRIPE_SECRET_KEY: ${{ (matrix.project == 'walkthrough' && secrets.STRIPE_SECRET_KEY) || 'sk_test_ci_e2e_dummy' }}
      STRIPE_WEBHOOK_SECRET: whsec_e2e_payments
      STRIPE_CONNECT_TEST_ACCOUNT: ${{ matrix.project == 'walkthrough' && secrets.STRIPE_CONNECT_TEST_ACCOUNT || '' }}
      # The BROWSER's half of the walkthrough leg's Stripe key. STRIPE_SECRET_KEY
      # above is server-only; the client calls Stripe(publishableKey) to mount the
      # embedded checkout iframe, and NEXT_PUBLIC_* is baked in at BUILD time
      # (apps/web/src/lib/stripe-browser.ts), so an empty value here bakes an
      # empty string into the bundle no matter what the server-side key is. That
      # is not a config gap that degrades gracefully: stripe.js throws
      # `IntegrationError: Please call Stripe() with your publishable key. You
      # used an empty string`, the payment iframe never mounts, and only Stripe's
      # own always-present telemetry iframe (outer-logger) is in the DOM — which
      # `iframe[src*="stripe.com"]` still matches, so U1 spins for the full 45s
      # and fails on "Expected: visible / Received: hidden" with nothing in the
      # server log to explain it (confirmed 2026-09-08, run 34225268360).
      # Publishable keys are NOT secret by Stripe's own design (shipped in every
      # browser bundle), so this is a literal, not `secrets.*` — there is nothing
      # to leak. Same test-mode account STRIPE_SECRET_KEY authenticates against.
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ matrix.project == 'walkthrough' && 'pk_test_51C2ImvAy22H0xqqxi73ya0Xen6LeJG5GlRSHm7OpTnlQ2Nw1RFHt1pzJ61HyWgeQCu1IueWV7yterQK8yIUCrzeK00YnXPGvrn' || '' }}
      # v4 AI architect e2e (ai-architect.spec.ts): the spec starts a model
      # fixture server on 4319; the app server must point anthropicClient()
      # at it and carry a non-empty key so the ai-plan routes never 503.
      # Mirrors playwright.config.ts webServer.env, which only applies when
      # Playwright boots the server itself — here the workflow boots it.
      # CI-only dummy; no real Anthropic call is made.
      SCHEDULING_AI_BASE_URL: "http://127.0.0.1:4319"
      ANTHROPIC_API_KEY: sk-ant-e2e-fixture

    steps:
      - uses: actions/checkout@v5
        with:
          # Manual runs can target a PR by number; otherwise the pushed ref.
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Flyway CLI is downloaded by scripts/flyway.sh on first use; cache it
      # per pinned version so CI doesn't re-download every run.
      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/seazn-flyway
          key: flyway-cli-10.22.0-linux-x64

      - name: Bootstrap database (Flyway migrate)
        run: npm run db:apply

      - name: Sync sport catalog from the engine registry
        run: npm run sync:sports

      # Only the walkthrough leg carries a real STRIPE_SECRET_KEY (see env
      # block above) and only it needs live price ids. Every other leg keeps
      # the dummy key and would just burn a wasted Stripe call here. This
      # job's Postgres is a FRESH container per run — `stripe:sync` run
      # against any other environment (a laptop, staging) never reaches it,
      # so `plans` has no `stripe_price_id_onetime` until this step runs IN
      # THIS JOB. Mirrors ci.yml's "Live-Stripe integration tests" step,
      # which syncs then runs against its own ephemeral Postgres for the
      # identical reason.
      - name: Sync Stripe prices for the walkthrough leg
        if: matrix.project == 'walkthrough'
        run: npm run stripe:sync

      # There is no "Cache Next.js build cache" step here any more. It claimed
      # the build "only pays for what changed"; it did not. Next 16 builds with
      # Turbopack, which does not write a build cache to .next/cache unless
      # experimental.turbopackFileSystemCacheForBuild is on — so the step
      # restored an exact-key hit of 40 KB ("Cache Size: ~0 MB (40528 B)") in
      # every job of every run while each one still paid a full 29-58s cold
      # compile, and then lost the save to the same seven-way race the
      # Playwright cache lost. Turning that flag on is a change to what we
      # BUILD, not to how we cache it, so it is deliberately not bundled here;
      # reinstate this step in the same commit that enables it. ci.yml's smoke
      # job still carries the identical dead step.

      #
      # Backgrounded. This is the long pole of the setup phase (52-55s across
      # all five e2e runners on run 32008189967) and nothing before the `wait:`
      # below reads its output, so the placement image build and the Chromium
      # download ride alongside it instead of queueing behind it. Its log
      # interleaves with theirs — that is the documented cost of `background:`,
      # and the reason the DB steps above stay in the foreground as their own
      # named steps rather than being folded into one blob.
      - name: Build (production)
        id: build
        background: true
        run: npm run build --workspace apps/web
        env:
          SKIP_TYPECHECK: "1"

      # Serve the standalone output, the way fly.toml does (#356). `next start`
      # does not serve an `output: standalone` build — it warns and falls back
      # to the untraced .next tree, which is a different serving path from
      # production and cannot catch a standalone-only regression.
      #
      # `.next/static` is not part of the standalone output. Without staging it
      # the server answers /api/health and HTML 200 while every
      # /_next/static/*.js 404s — specs then fail one at a time on clicks that
      # look like product bugs (#342, which is what e2e/global-setup.ts's third
      # probe now refuses to run through).
      #
      # `rm -rf` first: `cp -R src dst` with dst present copies INTO it.
      # --- a REAL solver for this job --------------------------------------
      #
      # `placement-cutover.spec.ts` exists to prove an organiser clicking
      # Auto-schedule gets a board the OPTIMISER produced, and it asserts
      # exactly that: `data-engine="optimized"` on the result strip. Without a
      # reachable service `build.ts` catches the transport failure and returns
      # a greedy board — which is correct behaviour and makes that spec fail by
      # design (its own negative control is "service down -> FAIL").
      #
      # So without this container the spec could only ever prove the fallback,
      # which is the opposite of its purpose. Same pattern as ci.yml's smoke
      # job and placement-ci.yml's `integration` job; the image build is
      # cached (type=gha) and shared with them.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      #
      # Nothing consumes this build's imageid/digest; `load: true` puts the
      # image in the local daemon, which is a side effect, not an output. It
      # stays in the foreground (not backgrounded like the production build
      # above) — an undocumented backgrounded `uses:` step was measured on
      # this repo to lose its outputs (probe run 32011114196).
      - name: Build the placement service image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: services/placement
          file: services/placement/Dockerfile
          push: false
          load: true
          tags: placement-service:ci
      # Moved UP from after "Start server", where it used to sit: nothing about
      # downloading a browser needs a database, a build or a running server, so
      # down there it was ~16s of dead serial time. Browsers cached per
      # Playwright version. The cache RESTORE stays in the foreground (it is
      # ~3s, and a backgrounded actions/cache loses its outputs — see the note
      # on the image build above); only the download is backgrounded.
      # RESTORE ONLY. All seven jobs used to race one key on save and six lost
      # it every run — "Failed to save: Unable to reserve cache with key
      # playwright-…, another job may be creating this cache" (run
      # 32272599493). No writer here at all means no race, and it means the
      # key must be written somewhere a PR can read it: on main, by
      # e2e-cache-warm.yml, whose comment carries the full diagnosis of why
      # these jobs were missing a cache that already existed.
      - name: Restore Playwright browsers
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # No `--with-deps`. It installed NOTHING on this image — every package it
      # names came back "is already the newest version" on run 32272599493 —
      # while still paying a full `apt-get update` in all seven jobs. Chromium
      # refuses to launch with a clear host-dependency error if that ever stops
      # being true, so the failure mode is loud, not silent.
      - name: Install Playwright Chromium
        id: chromium
        background: true
        run: npx playwright install chromium
        working-directory: apps/web

      # The setup phase's join. Everything past this point needs the artefacts
      # the three background steps produce: the placement container needs the
      # image, `Start server` needs .next/standalone, and Playwright needs the
      # browser. A background step's FAILURE also surfaces here rather than
      # where it happened — so a red on this step means "read the interleaved
      # log above", not "the wait is broken".
      #
      # Serial, these three were ~90s (build 53 + image 18 + browser 16, plus
      # cache restores) on run 32008189967. Concurrent they cost about what the
      # build alone costs.
      - name: Wait for build, placement image and browser
        wait: [build, image, chromium]

      - name: Start the placement service
        run: |
          set -euo pipefail
          docker run -d --name placement-e2e -p 50051:50051 \
            -e PLACEMENT_SERVICE_SECRET=ci-e2e-secret \
            placement-service:ci
          opened=""
          for _ in $(seq 1 15); do
            if timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/50051' 2>/dev/null; then opened=1; break; fi
            sleep 1
          done
          if [ -z "$opened" ]; then
            echo "::error::placement port 50051 never accepted a TCP connection within 15s"
            docker logs placement-e2e || true
            exit 1
          fi

      # RS007: the registration money path through a REAL Stripe Connect hosted
      # checkout (`e2e/walkthrough/registration-connect.spec.ts`). Walkthrough
      # leg only, and only when the secrets exist — absent either one the spec
      # skips and says on stdout that fulfilment was never exercised.
      #
      # WHY A FORWARDER IS NOT OPTIONAL. The webhook is registrations' ONLY
      # fulfilment path (billing has `reconcileCheckout` as a missed-webhook
      # fallback; registrations have no equivalent), so without one the entry
      # stays `pending` after a successful charge and the spec fails at the
      # wait rather than passing vacuously. A runner has no inbound route from
      # Stripe, but it does not need one: `stripe listen` dials OUT over a
      # websocket and forwards inward to localhost.
      #
      # It must run BEFORE the server starts, because the session mints its own
      # `whsec` and the server reads that secret at boot. `$GITHUB_ENV` applies
      # to subsequent steps, so the override lands on the server step below.
      # Overriding it is safe HERE and only here: `payments-hardening.spec.ts`
      # signs synthetic webhooks against the job-level `whsec_e2e_payments`, and
      # it runs in a different matrix leg, in a different job.
      #
      # COST/RISK, stated rather than buried: on the walkthrough leg this makes
      # genuine Stripe test-mode API calls on every push to `main` — $0, but a
      # real external dependency, so a Stripe outage reds this leg.
      - name: Connect walkthrough not configured — skip loudly
        if: matrix.project == 'walkthrough' && (env.STRIPE_CONNECT_TEST_ACCOUNT == '' || env.STRIPE_SECRET_KEY == 'sk_test_ci_e2e_dummy')
        run: |
          echo "::warning::Connect walkthrough NOT run — the registration money path was not exercised. Needs both STRIPE_SECRET_KEY and STRIPE_CONNECT_TEST_ACCOUNT repo secrets."

      - name: Start Stripe webhook forwarder (walkthrough leg, secrets permitting)
        if: matrix.project == 'walkthrough' && env.STRIPE_CONNECT_TEST_ACCOUNT != '' && env.STRIPE_SECRET_KEY != 'sk_test_ci_e2e_dummy'
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          curl -fsSL https://github.com/stripe/stripe-cli/releases/download/v1.21.8/stripe_1.21.8_linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin stripe
          stripe listen --api-key "$STRIPE_API_KEY" \
            --forward-to http://localhost:3000/api/webhooks/stripe \
            --print-secret > whsec.txt 2>listen.log || { cat listen.log; exit 1; }
          secret=$(tr -d '[:space:]' < whsec.txt)
          if [ -z "$secret" ]; then echo "::error::stripe listen produced no webhook secret"; cat listen.log; exit 1; fi
          # Register it with the runner so it is redacted from every subsequent
          # step's log. `$GITHUB_ENV` makes it part of the env block that Actions
          # prints for each later step, and Actions masks only values it has been
          # told about -- this one is minted at runtime, so nothing masks it
          # otherwise. Must come after the empty-check: `::add-mask::` on an empty
          # string is a no-op that warns. Masking is not retroactive, which is fine
          # -- the leak was always in the LATER steps, never in this one.
          echo "::add-mask::$secret"
          echo "STRIPE_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
          echo "CONNECT_WALKTHROUGH=1" >> "$GITHUB_ENV"
          # Now hold the forwarder open for the rest of the job.
          stripe listen --api-key "$STRIPE_API_KEY" \
            --forward-to http://localhost:3000/api/webhooks/stripe > forward.log 2>&1 &
          echo "forwarder started (pid $!)"

      - name: Start server
        # On the SERVER, not the Playwright step: `build.ts` runs server-side,
        # so the server is what dials the solver. Set only on the test step,
        # the app would keep dialling the production default
        # (`placement.flycast:50051`) — unreachable from a runner — and every
        # board would come back greedy while the suite reported on it.
        env:
          PLACEMENT_SERVICE_HOST: localhost:50051
          PLACEMENT_SERVICE_SECRET: ci-e2e-secret
        run: |
          rm -rf apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          node apps/web/.next/standalone/apps/web/server.js > dev-server.log 2>&1 &
          echo "waiting for server…"
          up=""
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              echo "server up after ${i}s window"; up=1; break
            fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "server did not become healthy"; cat dev-server.log; exit 1
          fi
          chunk=$(ls apps/web/.next/static/chunks/*.js 2>/dev/null | head -1)
          if [ -z "$chunk" ]; then
            echo "no built chunks found — build output is not where expected"; exit 1
          fi
          asset="/_next/${chunk#apps/web/.next/}"
          if ! curl -sf "http://localhost:3000$asset" >/dev/null; then
            echo "static asset $asset 404s — standalone tree not staged"
            cat dev-server.log; exit 1
          fi
          echo "static assets serve ($asset)"

      # The probe above picks an ARBITRARY chunk (`ls … | head -1`) and only
      # proves the standalone tree was staged. It cannot see the #19 failure
      # mode: the bundler's own manifest naming a chunk id it never flushed,
      # so the route's HTML asks for a script the server 500s as
      # `content-type: text/plain`, React never hydrates, and every control
      # on the page is dead — while the page, /api/health and this probe all
      # stay green. Here that surfaces as N specs failing one at a time on
      # clicks that do nothing, which reads as a flake or as the change under
      # test. This step names the missing asset and every route referencing
      # it instead. Same gate ci.yml runs before smoke; this build is a
      # DIFFERENT build, so it needs its own.
      - name: Verify every route's referenced build chunks were written (#19)
        run: npm run check:build-chunks

      - name: Run Playwright e2e (${{ matrix.group }})
        run: npx playwright test --project=${{ matrix.project }} ${{ matrix.args }}
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE: http://localhost:3000
          E2E_PARALLEL_SLICE: ${{ matrix.slice }}

      # Distinct from "Connect walkthrough not configured" above: that one
      # keys on STRIPE_CONNECT_TEST_ACCOUNT and covers the REGISTRATION money
      # path (settings-sponsor-monetize.spec.ts). This one covers the Event
      # Pass money path (event-pass.spec.ts) and keys on the JSON report
      # itself — a pass count cannot tell "U1 and U16 ran and passed" apart
      # from "U1 and U16 were skipped", and only the skip count can. Runs even
      # when the test step above failed, so it reports the real cause instead
      # of being skipped itself and reading as "not applicable".
      - name: Event Pass money path must have RUN, not skipped
        if: always() && matrix.project == 'walkthrough'
        run: |
          REPORT=apps/web/playwright-report/results.json
          if [ ! -f "$REPORT" ]; then
            echo "::error::no JSON report at $REPORT — the money-path check cannot run"
            exit 1
          fi
          node -e '
            const r = require(require("path").resolve(process.env.REPORT));
            const want = ["U1 ·", "U16 ·"];
            const titles = [];
            const walk = (s) => {
              for (const spec of s.specs ?? []) {
                for (const t of spec.tests ?? []) {
                  titles.push([spec.title, t.results?.[0]?.status ?? "unknown"]);
                }
              }
              for (const c of s.suites ?? []) walk(c);
            };
            for (const s of r.suites ?? []) walk(s);
            const bad = want.flatMap((w) =>
              titles.filter(([t]) => t.includes(w))
                    .filter(([, st]) => st === "skipped" || st === "pending")
                    .map(([t]) => t));
            const seen = want.filter((w) => titles.some(([t]) => t.includes(w)));
            if (seen.length !== want.length) {
              console.error("::error::money-path tests not found in the report: " +
                want.filter((w) => !seen.includes(w)).join(", "));
              process.exit(1);
            }
            if (bad.length) {
              // ARMED vs ADVISORY. The money path currently skips for a known,
              // owner-gated reason: Stripe answers `resource_missing` because
              // the Event Pass price does not exist in the shared test account
              // until `stripe:sync` runs. Hard-failing on that reds `main`
              // permanently, and a permanently red gate is one everybody
              // learns to scroll past — which is how the money path went
              // unnoticed in the first place.
              //
              // So: shout by default, FAIL once someone sets
              // E2E_REQUIRE_MONEY_PATH=1. Flip it in this workflow the moment
              // `stripe:sync` has run — that is what turns this back into a
              // gate rather than a notice, and it is the whole point of the
              // step existing.
              const msg = "the Event Pass money path SKIPPED: " + bad.join(" | ");
              if (process.env.E2E_REQUIRE_MONEY_PATH === "1") {
                console.error("::error::" + msg);
                process.exit(1);
              }
              console.log("::warning::" + msg +
                " — advisory only (E2E_REQUIRE_MONEY_PATH is not set). If this is" +
                " NOT the unsynced-price case, it is a real regression: read the" +
                " skip annotation, it reports the probe status.");
              process.exit(0);
            }
            console.log("money path ran: " + seen.join(", "));
          '
        env:
          REPORT: apps/web/playwright-report/results.json
          # Armed 2026-09-08 after `stripe:sync` created the Event Pass price
          # (run 34222651347 proved the arming itself: SKIPPED correctly
          # hard-failed) and, once the walkthrough leg's own ephemeral DB and
          # its browser-side NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY were fixed
          # (see the two comments above `stripe:sync` and next to that env
          # var), U1 and U16 actually RAN and PASSED for real (run
          # 34232777679, `money path ran: U1 ·, U16 ·`). A future SKIPPED is
          # therefore a real regression again, not the historical unsynced-
          # price gap — hard-fail it rather than downgrading back to a warning.
          E2E_REQUIRE_MONEY_PATH: "1"

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per leg: three jobs uploading one artifact name collide and the
          # later ones fail the upload, losing the report for the failure you
          # actually wanted to read.
          name: playwright-report-${{ matrix.slug }}
          path: apps/web/playwright-report
          retention-days: 7

      - name: Dev server log (on failure)
        if: failure()
        run: cat dev-server.log || true

      # Last, so the container outlives every step that needs it. In ci.yml an
      # earlier revision tore its container down immediately after the vitest
      # step and the smoke run failed eleven steps later with a message that
      # named the WASM and had nothing to do with it.
      - name: Placement service logs and teardown
        if: always()
        run: |
          docker logs placement-e2e || true
          docker rm -f placement-e2e >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------
  # Specs entangled with shared org-level state: owned-org quota (billing,
  # billing-states, org-management all mint orgs on the shared Pro user — cap
  # + reasoning in e2e/auth.setup.ts, "ORG BUDGET"), the community org's
  # competitions.max_active slots (journey-community, device-links), org
  # renames, plan flips, and the single Pro scorer seat. One worker, one file
  # at a time. See playwright.config.ts's `serial` project (fullyParallel:
  # false there too — belt and suspenders with this job's own --workers=1).
  # ---------------------------------------------------------------------
  e2e-serial:
    name: Playwright e2e — serial (Postgres container)
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    # See e2e-parallel's timeout note: no job here had one, so a hung
    # Playwright run burned GitHub's 360-minute default. p95 is ~7 minutes.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL: disable
      AUTH_SECRET: ci-only-insecure-secret-please-change-in-prod-0123456789
      SUPABASE_JWT_PRIVATE_KEY: '{"kty":"EC","x":"JkXLFTKBFmcNZj3uxo9IG_ChGy4qe0O8uRjgI8iyF1Q","y":"_2CkI9u7EVulWYy58pcUwZpiFBhC5qba8xZTrHfVi0s","crv":"P-256","d":"enLYu03-bP8O-YTy5DjWbt8Cl2ocm2KorNJlBD5bUzY","alg":"ES256","kid":"e2e-ci-es256","use":"sig"}'
      SUPABASE_JWT_SECRET: ci-only-insecure-jwt-secret-please-change-in-prod-0123456789
      NEXT_PUBLIC_SUPABASE_URL: "https://stub.supabase.co"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_PROD_TARGET: "1"
      # The v3 scoring pad soft-commits ONLY when an enrichment dock has chips
      # (usesSoftCommit). Empty-dock taps and `*.clock` submit immediately. When
      # a hold DOES apply, the event enters the durable queue at once but is not
      # SENT for queue.ts's HOLD_MS, and a spec that polls the ledger has to wait
      # that window out per tap. Shipped is 5s (was 12s; owner-ruled), which puts
      # the walkthrough specs — badminton alone taps sixteen rallies — past their
      # 180s budget. 3s here, set at JOB level so the identical value reaches
      # both the production BUILD (NEXT_PUBLIC_* is substituted into the client
      # bundle at build time, so the pad in the browser holds for 3s) and the
      # Playwright runner (which imports queue.ts to derive its own waits from
      # the same number). Setting it on only one of those two would leave the
      # specs racing a window the browser is not using.
      #
      # queue.ts's `resolveHoldMs` falls back to the SHIPPED default for anything
      # unusable, so a typo here slows this leg down rather than turning the
      # hold off — and the shipped value keeps its own floor test, which is
      # pinned on the default and is therefore untouched by this override.
      NEXT_PUBLIC_SCOREPAD_HOLD_MS: "3000"
      STRIPE_SECRET_KEY: sk_test_ci_e2e_dummy
      STRIPE_WEBHOOK_SECRET: whsec_e2e_payments
      SCHEDULING_AI_BASE_URL: "http://127.0.0.1:4319"
      ANTHROPIC_API_KEY: sk-ant-e2e-fixture

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/seazn-flyway
          key: flyway-cli-10.22.0-linux-x64

      - name: Bootstrap database (Flyway migrate)
        run: npm run db:apply

      - name: Sync sport catalog from the engine registry
        run: npm run sync:sports

      # There is no "Cache Next.js build cache" step here any more. It claimed
      # the build "only pays for what changed"; it did not. Next 16 builds with
      # Turbopack, which does not write a build cache to .next/cache unless
      # experimental.turbopackFileSystemCacheForBuild is on — so the step
      # restored an exact-key hit of 40 KB ("Cache Size: ~0 MB (40528 B)") in
      # every job of every run while each one still paid a full 29-58s cold
      # compile, and then lost the save to the same seven-way race the
      # Playwright cache lost. Turning that flag on is a change to what we
      # BUILD, not to how we cache it, so it is deliberately not bundled here;
      # reinstate this step in the same commit that enables it. ci.yml's smoke
      # job still carries the identical dead step.

      #
      # Backgrounded. This is the long pole of the setup phase (52-55s across
      # all five e2e runners on run 32008189967) and nothing before the `wait:`
      # below reads its output, so the placement image build and the Chromium
      # download ride alongside it instead of queueing behind it. Its log
      # interleaves with theirs — that is the documented cost of `background:`,
      # and the reason the DB steps above stay in the foreground as their own
      # named steps rather than being folded into one blob.
      - name: Build (production)
        id: build
        background: true
        run: npm run build --workspace apps/web
        env:
          SKIP_TYPECHECK: "1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      #
      # Nothing consumes this build's imageid/digest; `load: true` puts the
      # image in the local daemon, which is a side effect, not an output. It
      # stays in the foreground (not backgrounded like the production build
      # above) — an undocumented backgrounded `uses:` step was measured on
      # this repo to lose its outputs (probe run 32011114196).
      - name: Build the placement service image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: services/placement
          file: services/placement/Dockerfile
          push: false
          load: true
          tags: placement-service:ci
      # Moved UP from after "Start server", where it used to sit: nothing about
      # downloading a browser needs a database, a build or a running server, so
      # down there it was ~16s of dead serial time. Browsers cached per
      # Playwright version. The cache RESTORE stays in the foreground (it is
      # ~3s, and a backgrounded actions/cache loses its outputs — see the note
      # on the image build above); only the download is backgrounded.
      # RESTORE ONLY. All seven jobs used to race one key on save and six lost
      # it every run — "Failed to save: Unable to reserve cache with key
      # playwright-…, another job may be creating this cache" (run
      # 32272599493). No writer here at all means no race, and it means the
      # key must be written somewhere a PR can read it: on main, by
      # e2e-cache-warm.yml, whose comment carries the full diagnosis of why
      # these jobs were missing a cache that already existed.
      - name: Restore Playwright browsers
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # No `--with-deps`. It installed NOTHING on this image — every package it
      # names came back "is already the newest version" on run 32272599493 —
      # while still paying a full `apt-get update` in all seven jobs. Chromium
      # refuses to launch with a clear host-dependency error if that ever stops
      # being true, so the failure mode is loud, not silent.
      - name: Install Playwright Chromium
        id: chromium
        background: true
        run: npx playwright install chromium
        working-directory: apps/web

      # The setup phase's join. Everything past this point needs the artefacts
      # the three background steps produce: the placement container needs the
      # image, `Start server` needs .next/standalone, and Playwright needs the
      # browser. A background step's FAILURE also surfaces here rather than
      # where it happened — so a red on this step means "read the interleaved
      # log above", not "the wait is broken".
      #
      # Serial, these three were ~90s (build 53 + image 18 + browser 16, plus
      # cache restores) on run 32008189967. Concurrent they cost about what the
      # build alone costs.
      - name: Wait for build, placement image and browser
        wait: [build, image, chromium]

      - name: Start the placement service
        run: |
          set -euo pipefail
          docker run -d --name placement-e2e -p 50051:50051 \
            -e PLACEMENT_SERVICE_SECRET=ci-e2e-secret \
            placement-service:ci
          opened=""
          for _ in $(seq 1 15); do
            if timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/50051' 2>/dev/null; then opened=1; break; fi
            sleep 1
          done
          if [ -z "$opened" ]; then
            echo "::error::placement port 50051 never accepted a TCP connection within 15s"
            docker logs placement-e2e || true
            exit 1
          fi

      - name: Start server
        env:
          PLACEMENT_SERVICE_HOST: localhost:50051
          PLACEMENT_SERVICE_SECRET: ci-e2e-secret
        run: |
          rm -rf apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          node apps/web/.next/standalone/apps/web/server.js > dev-server.log 2>&1 &
          echo "waiting for server…"
          up=""
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              echo "server up after ${i}s window"; up=1; break
            fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "server did not become healthy"; cat dev-server.log; exit 1
          fi
          chunk=$(ls apps/web/.next/static/chunks/*.js 2>/dev/null | head -1)
          if [ -z "$chunk" ]; then
            echo "no built chunks found — build output is not where expected"; exit 1
          fi
          asset="/_next/${chunk#apps/web/.next/}"
          if ! curl -sf "http://localhost:3000$asset" >/dev/null; then
            echo "static asset $asset 404s — standalone tree not staged"
            cat dev-server.log; exit 1
          fi
          echo "static assets serve ($asset)"

      # The probe above picks an ARBITRARY chunk (`ls … | head -1`) and only
      # proves the standalone tree was staged. It cannot see the #19 failure
      # mode: the bundler's own manifest naming a chunk id it never flushed,
      # so the route's HTML asks for a script the server 500s as
      # `content-type: text/plain`, React never hydrates, and every control
      # on the page is dead — while the page, /api/health and this probe all
      # stay green. Here that surfaces as N specs failing one at a time on
      # clicks that do nothing, which reads as a flake or as the change under
      # test. This step names the missing asset and every route referencing
      # it instead. Same gate ci.yml runs before smoke; this build is a
      # DIFFERENT build, so it needs its own.
      - name: Verify every route's referenced build chunks were written (#19)
        run: npm run check:build-chunks

      - name: Run Playwright e2e (serial project)
        run: npx playwright test --project=serial --workers=1
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE: http://localhost:3000

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-serial
          path: apps/web/playwright-report
          retention-days: 7

      - name: Dev server log (on failure)
        if: failure()
        run: cat dev-server.log || true

      - name: Placement service logs and teardown
        if: always()
        run: |
          docker logs placement-e2e || true
          docker rm -f placement-e2e >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------
  # v3/02 §4 viewport gate + #349 responsive matrix, all seven widths, spread
  # over three matrix legs. See this file's header comment for the two separate
  # constraints: `--workers=1` is mandatory WITHIN a leg (the widths in a leg
  # share that leg's `setup` org), and there is no race ACROSS legs (each gets
  # its own job-scoped Postgres and its own org). Full suite per width (owner
  # decision, spec §1): every gate assertion holds at every width; LCP
  # self-pins to 375/390 inside the test, so no leg needs to own both.
  # ---------------------------------------------------------------------
  e2e-mobile:
    name: Playwright e2e — ${{ matrix.group }} (Postgres container)
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    # See e2e-parallel's timeout note: no job here had one, so a hung
    # Playwright run burned GitHub's 360-minute default. p95 is ~7 minutes.
    timeout-minutes: 20

    # Grouped by device class, not round-robin, so a red leg names a coherent
    # band ("tablets are broken") instead of an arbitrary third of the matrix.
    # 3/2/2 rather than 3/3/1: the legs are ~21 tests per width, so the longest
    # leg sets the wall clock and a 3/3/1 split would waste a runner on 21
    # tests behind ~125s of setup.
    strategy:
      fail-fast: false # one width band's failure must not hide another's
      matrix:
        # `slug` exists because `group` is display text and reaches
        # upload-artifact below: actions/upload-artifact@v4 REJECTS a name
        # containing "/" (and fails the whole job on a duplicate name, which is
        # what a shared literal across three legs would produce). `slug` is the
        # artifact-safe half; do not collapse the two back into one field.
        include:
          - group: phones-small 320/360/375
            slug: phones-small
            projects: --project=mobile-320 --project=mobile-360 --project=mobile-se
          - group: phones-large 390/430
            slug: phones-large
            projects: --project=mobile-14 --project=mobile-430
          - group: tablets 768/834
            slug: tablets
            projects: --project=tablet-768 --project=tablet-834

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL: disable
      AUTH_SECRET: ci-only-insecure-secret-please-change-in-prod-0123456789
      SUPABASE_JWT_PRIVATE_KEY: '{"kty":"EC","x":"JkXLFTKBFmcNZj3uxo9IG_ChGy4qe0O8uRjgI8iyF1Q","y":"_2CkI9u7EVulWYy58pcUwZpiFBhC5qba8xZTrHfVi0s","crv":"P-256","d":"enLYu03-bP8O-YTy5DjWbt8Cl2ocm2KorNJlBD5bUzY","alg":"ES256","kid":"e2e-ci-es256","use":"sig"}'
      SUPABASE_JWT_SECRET: ci-only-insecure-jwt-secret-please-change-in-prod-0123456789
      NEXT_PUBLIC_SUPABASE_URL: "https://stub.supabase.co"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_PROD_TARGET: "1"
      # The v3 scoring pad soft-commits ONLY when an enrichment dock has chips
      # (usesSoftCommit). Empty-dock taps and `*.clock` submit immediately. When
      # a hold DOES apply, the event enters the durable queue at once but is not
      # SENT for queue.ts's HOLD_MS, and a spec that polls the ledger has to wait
      # that window out per tap. Shipped is 5s (was 12s; owner-ruled), which puts
      # the walkthrough specs — badminton alone taps sixteen rallies — past their
      # 180s budget. 3s here, set at JOB level so the identical value reaches
      # both the production BUILD (NEXT_PUBLIC_* is substituted into the client
      # bundle at build time, so the pad in the browser holds for 3s) and the
      # Playwright runner (which imports queue.ts to derive its own waits from
      # the same number). Setting it on only one of those two would leave the
      # specs racing a window the browser is not using.
      #
      # queue.ts's `resolveHoldMs` falls back to the SHIPPED default for anything
      # unusable, so a typo here slows this leg down rather than turning the
      # hold off — and the shipped value keeps its own floor test, which is
      # pinned on the default and is therefore untouched by this override.
      NEXT_PUBLIC_SCOREPAD_HOLD_MS: "3000"
      STRIPE_SECRET_KEY: sk_test_ci_e2e_dummy
      STRIPE_WEBHOOK_SECRET: whsec_e2e_payments
      SCHEDULING_AI_BASE_URL: "http://127.0.0.1:4319"
      ANTHROPIC_API_KEY: sk-ant-e2e-fixture

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/seazn-flyway
          key: flyway-cli-10.22.0-linux-x64

      - name: Bootstrap database (Flyway migrate)
        run: npm run db:apply

      - name: Sync sport catalog from the engine registry
        run: npm run sync:sports

      # There is no "Cache Next.js build cache" step here any more. It claimed
      # the build "only pays for what changed"; it did not. Next 16 builds with
      # Turbopack, which does not write a build cache to .next/cache unless
      # experimental.turbopackFileSystemCacheForBuild is on — so the step
      # restored an exact-key hit of 40 KB ("Cache Size: ~0 MB (40528 B)") in
      # every job of every run while each one still paid a full 29-58s cold
      # compile, and then lost the save to the same seven-way race the
      # Playwright cache lost. Turning that flag on is a change to what we
      # BUILD, not to how we cache it, so it is deliberately not bundled here;
      # reinstate this step in the same commit that enables it. ci.yml's smoke
      # job still carries the identical dead step.

      #
      # Backgrounded. This is the long pole of the setup phase (52-55s across
      # all five e2e runners on run 32008189967) and nothing before the `wait:`
      # below reads its output, so the placement image build and the Chromium
      # download ride alongside it instead of queueing behind it. Its log
      # interleaves with theirs — that is the documented cost of `background:`,
      # and the reason the DB steps above stay in the foreground as their own
      # named steps rather than being folded into one blob.
      - name: Build (production)
        id: build
        background: true
        run: npm run build --workspace apps/web
        env:
          SKIP_TYPECHECK: "1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      #
      # Nothing consumes this build's imageid/digest; `load: true` puts the
      # image in the local daemon, which is a side effect, not an output. It
      # stays in the foreground (not backgrounded like the production build
      # above) — an undocumented backgrounded `uses:` step was measured on
      # this repo to lose its outputs (probe run 32011114196).
      - name: Build the placement service image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: services/placement
          file: services/placement/Dockerfile
          push: false
          load: true
          tags: placement-service:ci
      # Moved UP from after "Start server", where it used to sit: nothing about
      # downloading a browser needs a database, a build or a running server, so
      # down there it was ~16s of dead serial time. Browsers cached per
      # Playwright version. The cache RESTORE stays in the foreground (it is
      # ~3s, and a backgrounded actions/cache loses its outputs — see the note
      # on the image build above); only the download is backgrounded.
      # RESTORE ONLY. All seven jobs used to race one key on save and six lost
      # it every run — "Failed to save: Unable to reserve cache with key
      # playwright-…, another job may be creating this cache" (run
      # 32272599493). No writer here at all means no race, and it means the
      # key must be written somewhere a PR can read it: on main, by
      # e2e-cache-warm.yml, whose comment carries the full diagnosis of why
      # these jobs were missing a cache that already existed.
      - name: Restore Playwright browsers
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # No `--with-deps`. It installed NOTHING on this image — every package it
      # names came back "is already the newest version" on run 32272599493 —
      # while still paying a full `apt-get update` in all seven jobs. Chromium
      # refuses to launch with a clear host-dependency error if that ever stops
      # being true, so the failure mode is loud, not silent.
      - name: Install Playwright Chromium
        id: chromium
        background: true
        run: npx playwright install chromium
        working-directory: apps/web

      # The setup phase's join. Everything past this point needs the artefacts
      # the three background steps produce: the placement container needs the
      # image, `Start server` needs .next/standalone, and Playwright needs the
      # browser. A background step's FAILURE also surfaces here rather than
      # where it happened — so a red on this step means "read the interleaved
      # log above", not "the wait is broken".
      #
      # Serial, these three were ~90s (build 53 + image 18 + browser 16, plus
      # cache restores) on run 32008189967. Concurrent they cost about what the
      # build alone costs.
      - name: Wait for build, placement image and browser
        wait: [build, image, chromium]

      - name: Start the placement service
        run: |
          set -euo pipefail
          docker run -d --name placement-e2e -p 50051:50051 \
            -e PLACEMENT_SERVICE_SECRET=ci-e2e-secret \
            placement-service:ci
          opened=""
          for _ in $(seq 1 15); do
            if timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/50051' 2>/dev/null; then opened=1; break; fi
            sleep 1
          done
          if [ -z "$opened" ]; then
            echo "::error::placement port 50051 never accepted a TCP connection within 15s"
            docker logs placement-e2e || true
            exit 1
          fi

      - name: Start server
        env:
          PLACEMENT_SERVICE_HOST: localhost:50051
          PLACEMENT_SERVICE_SECRET: ci-e2e-secret
        run: |
          rm -rf apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          node apps/web/.next/standalone/apps/web/server.js > dev-server.log 2>&1 &
          echo "waiting for server…"
          up=""
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              echo "server up after ${i}s window"; up=1; break
            fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "server did not become healthy"; cat dev-server.log; exit 1
          fi
          chunk=$(ls apps/web/.next/static/chunks/*.js 2>/dev/null | head -1)
          if [ -z "$chunk" ]; then
            echo "no built chunks found — build output is not where expected"; exit 1
          fi
          asset="/_next/${chunk#apps/web/.next/}"
          if ! curl -sf "http://localhost:3000$asset" >/dev/null; then
            echo "static asset $asset 404s — standalone tree not staged"
            cat dev-server.log; exit 1
          fi
          echo "static assets serve ($asset)"

      # The probe above picks an ARBITRARY chunk (`ls … | head -1`) and only
      # proves the standalone tree was staged. It cannot see the #19 failure
      # mode: the bundler's own manifest naming a chunk id it never flushed,
      # so the route's HTML asks for a script the server 500s as
      # `content-type: text/plain`, React never hydrates, and every control
      # on the page is dead — while the page, /api/health and this probe all
      # stay green. Here that surfaces as N specs failing one at a time on
      # clicks that do nothing, which reads as a flake or as the change under
      # test. This step names the missing asset and every route referencing
      # it instead. Same gate ci.yml runs before smoke; this build is a
      # DIFFERENT build, so it needs its own.
      - name: Verify every route's referenced build chunks were written (#19)
        run: npm run check:build-chunks

      # This leg's widths, serialized (--workers=1) — see this job's header
      # comment. `--workers=1` is per-leg and must not be raised: the widths in
      # a leg share this leg's `setup` org.
      - name: Run Playwright e2e (${{ matrix.group }})
        run: npx playwright test ${{ matrix.projects }} --workers=1
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE: http://localhost:3000

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile-${{ matrix.slug }}
          path: apps/web/playwright-report
          retention-days: 7

      - name: Dev server log (on failure)
        if: failure()
        run: cat dev-server.log || true

      - name: Placement service logs and teardown
        if: always()
        run: |
          docker logs placement-e2e || true
          docker rm -f placement-e2e >/dev/null 2>&1 || true
