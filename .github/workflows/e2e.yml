        run: cat dev-server.log || true

      - name: Placement service logs and teardown
        if: always()
        run: |
          docker logs placement-e2e || true
          docker rm -f placement-e2e >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------
  # v3/02 §4 viewport gate + #349 responsive matrix, all seven widths, in ONE
  # job — see this file's header comment for why `--workers=1` and one job
  # rather than one job per width: all seven run mobile.spec.ts against the
  # SAME org this job's `setup` project mints, and running them concurrently
  # is the documented "7 width projects race each other over ONE org"
