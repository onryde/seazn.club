          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # All seven, serialized (--workers=1) — see this job's header comment.
      - name: Run Playwright e2e (mobile + tablet projects, all 7 widths)
        run: npx playwright test --project=mobile-se --project=mobile-14 --project=mobile-320 --project=mobile-360 --project=mobile-430 --project=tablet-768 --project=tablet-834 --workers=1
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE: http://localhost:3000

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile
          path: apps/web/playwright-report
          retention-days: 7

      - name: Dev server log (on failure)
        if: failure()
        run: cat dev-server.log || true

      - name: Placement service logs and teardown
        if: always()
        run: |
          docker logs placement-e2e || true
          docker rm -f placement-e2e >/dev/null 2>&1 || true
