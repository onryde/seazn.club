name: Parallel-steps probe

# THROWAWAY. Delete this file once the questions below are answered and the
# answers are recorded in the Tier-1 commit that uses them.
#
# GitHub shipped `background:` / `wait:` / `wait-all:` / `cancel:` / `parallel:`
# for steps on 2026-06-25. The changelog and the third-party writeups agree on
# the syntax and on three semantics (max 10 concurrent background steps;
# a background failure surfaces at the next wait; outputs and $GITHUB_ENV
# writes are only visible after the wait). They are SILENT on the one thing
# that decides how much this repo can actually save:
#
#   Q1. Can a `uses:` step be backgrounded, or only `run:`?
#       Every writeup's example backgrounds a `run:` step. This repo's
#       longest parallelisable setup item is `docker/build-push-action@v6`
#       (the placement image, 11-18s), and in ci.yml's `smoke-db` job it is
#       the ONLY parallelisable item — if the answer is "run: only", Tier 1
#       buys smoke-db exactly nothing and the plan changes.
#
#   Q2. Is the feature even enabled for this repo/plan? A silently-ignored
#       `background: true` would run everything in series and still go green,
#       which is the worst outcome: a "saving" that never happened.
#
# Triggered by a PR that touches THIS FILE, and nothing else. `workflow_dispatch`
# alone would not do: a dispatch-only workflow has to exist on the default
# branch before it can be dispatched at all, and this file is meant to be
# deleted before it ever lands there. The `paths` filter is what keeps it from
# running on every unrelated PR — it fires on the PR that adds it, answers the
# two questions above, and then the file goes away.
on:
  pull_request:
    paths:
      - .github/workflows/parallel-steps-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Q2 first, because every other answer is meaningless if the keywords are
  # inert. Three sleeps that cannot finish in series inside the wall: 3x8s
  # serial = 24s, concurrent = ~8s. The assertion is on ELAPSED TIME, not on
  # the steps passing — a runner that ignores `parallel:` passes every step
  # and takes 24s, and only the clock can tell the two apart.
  # -----------------------------------------------------------------------
  q2-is-it-live:
    name: Q2 — are the keywords actually honoured
    runs-on: ubuntu-latest
    steps:
      - name: Stamp the start
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - parallel:
          - name: sleep a
            run: sleep 8
          - name: sleep b
            run: sleep 8
          - name: sleep c
            run: sleep 8
      - name: Assert they overlapped
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - START ))
          echo "elapsed=${elapsed}s (serial would be ~24s, concurrent ~8s)"
          if [ "$elapsed" -ge 18 ]; then
            echo "::error::parallel: appears INERT — 3x8s took ${elapsed}s. Tier 1 is off the table until this is understood."
            exit 1
          fi
          echo "parallel: is honoured."

  # -----------------------------------------------------------------------
  # Q1. Background a `uses:` step and a `run:` step together, then wait on
  # both by id. Uses actions/cache@v4 with a key that will never hit — the
  # point is whether the RUNNER will background a `uses:` step at all, not
  # what the action does. A cache miss is a success for this probe.
  #
  # `continue-on-error` is deliberately NOT set: if backgrounding a `uses:`
  # step is rejected, this job must go red and say so.
  # -----------------------------------------------------------------------
  q1-can-uses-background:
    # Quoted: a bare ": " inside a YAML scalar starts a mapping. Unquoted,
    # `name: Q1 — can a uses: step be backgrounded` fails to parse.
    name: "Q1 — can a `uses:` step be backgrounded"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Background a `uses:` step"
        id: bg-uses
        uses: actions/cache@v4
        with:
          path: .probe-cache
          key: parallel-steps-probe-never-hits-${{ github.run_id }}
        background: true
      - name: "Background a `run:` step"
        id: bg-run
        run: sleep 6
        background: true
      - name: Wait for both
        wait: [bg-uses, bg-run]
      - name: Report
        run: |
          echo "Both background steps completed. uses: CAN be backgrounded."
          echo "cache-hit output after wait: '${{ steps.bg-uses.outputs.cache-hit }}'"
