name: Stg

# Flyway migrate against the staging database, THEN deploy the app to Fly.
# Fires on every push to main — i.e. every merge — and trusts that ci.yml
# already gated the tree as a PR (a squash-merge lands the exact tree the PR
# validated, so re-running those gates here would test the same code twice).
#
# NO `needs:` — the gates live in a SEPARATE workflow (ci.yml) now, and a
# `needs:` job can only reference jobs in its own workflow file. Same
# reasoning placement-prod.yml's `deploy` job already uses: this workflow
# only runs on push, ci.yml only runs on pull_request, and they never
# overlap, so the gates having already been green is trusted rather than
# re-checked here.
#
# Migration-before-deploy means every migration must be backward compatible
# with the app version still running (expand/contract) — if the migrate step
# fails, the old app keeps running untouched.
#
# Requires the STAGING_DATABASE_URL secret (Supabase SESSION pooler, port
# 5432 — Flyway's JDBC driver doesn't get along with the transaction
# pooler's statement handling on 6543). Staging was already baselined once
# (the one-time "Baseline staging DB" workflow that did it was removed
# 2026-08-11, its job done); a NEW pre-Flyway database would need
# `bash scripts/flyway.sh baseline` run by hand before this can migrate it.
on:
  push:
    branches: [main]

jobs:
  deploy-stg:
    name: Deploy (stg)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-stg
      # Staging is latest-wins: stacked merges to main supersede the deploy in
      # flight instead of queuing three identical ones (2026-07-18 merge train).
      cancel-in-progress: true
    env:
      # Job-level mapping so the sync step's `if:` can see whether the secret
      # exists (the secrets context isn't readable from step conditionals).
      STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5 # scripts/flyway.sh parses DATABASE_URL with node
        with:
          node-version: 26
          cache: pnpm
      # stripe-sync.ts and sync-sports.ts import postgres, stripe and
      # @seazn/engine/sports from the repo ROOT, so those three are root
      # PRODUCTION dependencies — --prod honours the section, unlike npm ci
      # --omit=dev which used to find them hoisted out of apps/web.
      #
      # That reasoning is TRANSITIVE: @seazn/engine's own runtime imports must
      # be in ITS `dependencies` too. pnpm gives no walk-up to a hoisted copy,
      # so a devDependency-only entry resolves in every other job and dies with
      # ERR_MODULE_NOT_FOUND here alone. packages/engine/test/runtime-deps.test.ts
      # is the gate; it is why zod sits in dependencies, not devDependencies.
      - run: pnpm install --frozen-lockfile --prod

      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/seazn-flyway
          key: flyway-cli-10.22.0-linux-x64

      - name: Pending migrations
        run: bash scripts/flyway.sh info
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Migrate staging database (Flyway)
        run: bash scripts/flyway.sh migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      # Sport catalog rows are GENERATED from the engine registry — new
      # sports ship as rows, not schema (v6/00). Idempotent upserts keyed by
      # sport/variant; must land before the app deploys or the division
      # builder serves a stale sport_variants catalog (known gotcha).
      - name: Sync sport catalog
        run: npm run sync:sports
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      # Idempotent by design: prices matched by lookup_key, currency_options
      # re-asserted, resulting ids written into `plans` (checkout 503s when
      # unsynced, so this must land before the app). Skips with a notice
      # until the STAGING_STRIPE_SECRET_KEY secret (test-mode key) exists —
      # a missing secret must not brick every main deploy.
      - name: Sync Stripe products/prices
        if: env.STAGING_STRIPE_SECRET_KEY != ''
        run: npm run stripe:sync
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
      - name: Stripe sync skipped
        if: env.STAGING_STRIPE_SECRET_KEY == ''
        run: echo "::warning::STAGING_STRIPE_SECRET_KEY not set — Stripe prices not synced; checkout will 503 until 'npm run stripe:sync' runs against staging."

      # The image is built HERE, on the runner, and pushed to fly's registry —
      # `flyctl deploy` then only ships a digest it already has.
      #
      # `flyctl deploy --remote-only` builds on a fly Depot builder, and that
      # builder cannot hold this build: it reports nproc=4 and NO cgroup memory
      # limit, so nothing bounds `next build` until the VM runs out and the
      # kernel SIGKILLs it. That happened deterministically once #480 moved the
      # builder stage to node:26-alpine — 80s/88s/117s across three attempts —
      # and capping the JS heap did not help, because the 3.83 GB peak is mostly
      # Turbopack's native side, outside anything NODE_OPTIONS bounds. A runner
      # has 16 GB and already proves this exact stage builds (ci.yml's PR-only
      # `docker build --target builder` job).
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # fly.stg.toml's [build.args] are read by flyctl's own builder, which is
      # no longer doing the build — so they are parsed out and handed to
      # `docker build` instead. Parsed rather than duplicated into this file:
      # NEXT_PUBLIC_* vars are baked into the client bundle at build time, and a
      # copy that silently drifted from fly.stg.toml would ship a bundle
      # pointing at the wrong Supabase/Stripe/base URL with nothing failing.
      - name: Read app name and build args from fly.stg.toml
        id: flycfg
        run: |
          node -e '
            const fs = require("fs");
            const toml = fs.readFileSync("fly.stg.toml", "utf8");
            const app = toml.match(/^\s*app\s*=\s*"([^"]+)"/m)?.[1];
            if (!app) { console.error("::error::no app name in fly.stg.toml"); process.exit(1); }
            const section = toml.split(/^\s*\[build\.args\]\s*$/m)[1] ?? "";
            const args = [];
            for (const line of section.split(/\r?\n/)) {
              if (/^\s*\[/.test(line)) break;
              const m = line.match(/^\s*([A-Za-z0-9_]+)\s*=\s*"([^"]*)"\s*$/);
              if (m) args.push(m[1] + "=" + m[2]);
            }
            if (!args.length) { console.error("::error::no [build.args] in fly.stg.toml"); process.exit(1); }
            console.log("app=" + app + ", " + args.length + " build args");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              "app=" + app + "\nargs<<FLYARGS\n" + args.join("\n") + "\nFLYARGS\n");
          '

      - name: Authenticate Docker against the fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.fly.io/${{ steps.flycfg.outputs.app }}:${{ github.sha }}
          # SENTRY_AUTH_TOKEN is a secret and stays out of fly.stg.toml; it is
          # passed the same way flyctl passed it (--build-arg), so its exposure
          # in image history is unchanged from before.
          build-args: |
            ${{ steps.flycfg.outputs.args }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

      # --image, so no builder is involved at all: fly pulls the digest above.
      - name: Deploy the pushed image
        run: flyctl deploy -c fly.stg.toml --image registry.fly.io/${{ steps.flycfg.outputs.app }}:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
