# Phase 1 canaries of @onryde/seazn-engine, published from the monorepo (engine-split spec 5.2 and 8, D16). There is no stable release from
# here: the first 1.0.0 is cut by Changesets in the engine repo at 2b.
#
# A push to main that touches packages/engine/** runs two jobs:
#   proof    the packed-tarball proof (the same script as ci.yml's engine-pack job). Read-only; the fixtures install from public npm.
#   publish  needs proof. Builds dist/, writes a canary version into the RUNNER's checkout of package.json (nothing is committed, tagged
#            or pushed), packs with pnpm, refuses a tarball whose manifest points at source or whose dist/ is empty, and publishes THAT
#            tarball to GitHub Packages under the dist-tag `canary`. Never `latest`.
#
# Version: 0.0.0-canary.<run number>.g<9 hex of the commit> (pack-proof/canary-lib.mjs says why that shape). A running publish is never
# cancelled; a push that arrives meanwhile waits, and a third replaces the second (GitHub keeps one pending run per group), so a canary
# may be skipped but the newest commit always gets one.
#
# Credentials: `packages: write` exists on the publish job only. The token is handed to the one publish step as NODE_AUTH_TOKEN and
# nowhere else; both checkouts drop it from .git/config. Pack and publish use pnpm: `publishConfig.exports` (the dist mapping) is
# applied by pnpm only, and `npm pack` would ship exports that point at ./src. Not triggered by pull requests, on purpose: a PR must
# not be able to publish.
name: engine-canary

on:
  push:
    branches: [main]
    paths: ["packages/engine/**"]

permissions:
  contents: read

concurrency:
  group: engine-canary
  cancel-in-progress: false

jobs:
  proof:
    name: Packed-tarball proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds dist/, packs it with the repo-pinned pnpm (asserting the version it ran) and fails on any fixture that errors or checks nothing.
      - name: Pack the engine and consume the tarball (node, next, rn, types)
        run: node packages/engine/pack-proof/run.mjs

  publish:
    name: Publish the canary
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      # No package-manager cache here: this is the job that holds the write token, and it reads nothing another job saved.
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: "@onryde"
          package-manager-cache: false
      # The engine and what it needs to build, selected by PATH (a name filter that matches nothing is a green no-op; this fails instead).
      - run: pnpm install --frozen-lockfile --filter ./packages/engine... --fail-if-no-match
      # `version=$(...)` as an assignment, so a script that fails fails the step (inside `echo $(...)` its exit status is lost).
      - name: Derive the canary version
        id: version
        run: |
          version="$(node packages/engine/pack-proof/canary.mjs version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build dist
        run: pnpm --filter ./packages/engine --fail-if-no-match run build:dist
      # Edits the runner's copy of package.json only; this workflow can neither commit nor push (contents: read).
      - name: Set the version on the runner's checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node packages/engine/pack-proof/canary.mjs set-version "$VERSION"
      - name: Pack
        run: pnpm --filter ./packages/engine --fail-if-no-match pack --pack-destination "$RUNNER_TEMP/engine-canary"
      # Name, version, a non-empty dist/ and exports that are all present dist/ files: the check pack-proof/run.mjs makes, on the file to be sent.
      - name: Check the tarball before it leaves the runner
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ runner.temp }}/engine-canary/onryde-seazn-engine-${{ steps.version.outputs.version }}.tgz
        run: node packages/engine/pack-proof/canary.mjs check "$TARBALL" "$VERSION"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ runner.temp }}/engine-canary/onryde-seazn-engine-${{ steps.version.outputs.version }}.tgz
        run: pnpm publish "$TARBALL" --tag canary --no-git-checks --access public
