[project]
name = "cp-sat-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15,<10",
    # The generated stubs are tracked in git, so the toolchain that produces
    # them is pinned exactly — a different-but-legal resolution would emit
    # different bytes and trip the drift gate in tests/test_proto_compiles.py.
    "grpcio-tools==1.81.1",
    # scheduler_pb2_grpc.py hard-embeds GRPC_GENERATED_VERSION='1.81.1' and
    # raises RuntimeError at import if the installed grpcio is older, so this
    # floor is the actual runtime invariant, not a preference.
    "grpcio>=1.81.1,<2",
    "grpcio-health-checking>=1.81.1,<2",
    # ortools caps protobuf at <6.34; state it here so pip fails fast on a
    # conflict instead of silently backtracking grpcio-tools off its pin.
    "protobuf>=6.33.5,<6.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
