[project]
name = "cp-sat-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15,<10",
    "grpcio>=1.66,<2",
    "grpcio-tools>=1.66,<2",
    "grpcio-health-checking>=1.66,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
