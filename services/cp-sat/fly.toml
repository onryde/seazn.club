# CP-SAT scheduling service — own Fly app, own image, deliberately separate
# from apps/web's (root Dockerfile/fly.toml). gRPC over raw TCP, called by
# apps/web only over Fly's private 6PN network
# (docs/superpowers/specs/2026-08-07-cpsat-scheduler-design.md, "Security":
# shared-secret auth substitutes for mTLS specifically because 6PN is already
# WireGuard-encrypted and not internet-reachable). Do not allocate a public
# IPv4/v6 for this app — that is a separate, explicit `fly ips allocate-*`
# step nothing here performs, and doing it would contradict that assumption.
#
# `app` MUST be exactly "cp-sat". Fly's private DNS is always
# <app-name>.internal, and packages/engine/src/scheduling/cpsat-client.ts's
# DEFAULT_HOST is the literal string "cp-sat.internal:50051" — it only yields
# to an explicit CPSAT_SERVICE_HOST env var, which nothing in this repo
# currently sets (checked: no reference anywhere outside that one file).
# Naming this app anything else breaks the zero-config path silently: every
# solve dials a host that does not exist, the gRPC call fails, and
# build.ts falls back to greedy placement with nothing surfacing why.
app = "cp-sat"
# Matches apps/web's root fly.toml — same Fly region, minimal added latency
# for an RPC that is already budgeted to the second.
primary_region = "lhr"

[build]

# A TCP service block, not [http_service]: that block is HTTP/1.1-oriented
# (methods, paths, force_https) and tuned for the web app's own traffic
# shape. This is gRPC over raw TCP.
[[services]]
  internal_port = 50051
  protocol = "tcp"
  # Fly's own config reference documents both of these identically under
  # [http_service] and a generic [[services]] block — confirmed directly
  # against https://fly.io/docs/reference/configuration/ (fetched twice,
  # independently, after an earlier draft of this file wrongly claimed
  # min_machines_running only exists under [http_service]; it does not).
  #
  # SCALE TO ZERO — owner decision 2026-08-10, reversing this file's
  # original "always warm" stance. The machine is sized for proof time, so
  # it is an expensive thing to leave idle between two organisers clicking
  # a button minutes apart.
  #
  # "suspend", NOT "stop", and the difference is the wall budget:
  # a suspended machine "preserve[s] memory and disk state, and resume[s]
  # faster than `stopped`" (Fly's machine-states docs). A cold start is
  # ~1-3s, an eighth of the 8-10s budget this whole investigation was built
  # around; a resume is not. Billing for the suspended state is NOT
  # documented by Fly (checked: the pricing page covers `stopped` only, at
  # $0.15/GB of rootfs per 30 days) — the expected cost either way is cents,
  # against machine-hours that are not, so this is a latency choice rather
  # than a cost one. If an invoice ever disagrees, "stop" is a one-word
  # change and costs only the cold start.
  #
  # min_machines_running = 0 is what actually permits zero. It only takes
  # effect "when auto_stop_machines is `stop` or `suspend`" (the docs' own
  # wording), so it was inert beside the previous "off".
  #
  # *** THIS SETTING IS INERT — WORSE, SILENTLY HARMFUL — UNLESS THE CALLER
  # DIALS `.flycast`. *** Autostart is a Fly Proxy feature. `<app>.internal`
  # bypasses the proxy and resolves straight to machine IPs, so a suspended
  # machine is simply unreachable: `build.ts` catches the failure and
  # returns a greedy board, which looks like "cp-sat lost on merit" rather
  # than an outage. `cpsat-client.ts`'s DEFAULT_HOST is `cp-sat.flycast:50051`
  # for exactly this reason, and the private IPv6 that makes `.flycast`
  # resolve is a ONE-TIME manual step (`fly ips allocate-v6 --private`) that
  # nothing here performs. See DEPLOY.md.
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [[services.ports]]
    port = 50051

  # A TCP accept, not a gRPC Health/Check — and kept that way deliberately.
  # The Task 04 audit found the original health servicer shared the solve
  # ThreadPoolExecutor: under max_workers concurrent solves, Health/Check
  # returned DEADLINE_EXCEEDED, and a liveness probe using it would kill the
  # machine mid-solve, dropping every in-flight solve with it.
  #
  # Verified in code for this task (src/cp_sat/main.py): that pool-exhaustion
  # bug IS fixed. The RPC thread pool is now sized `max_workers +
  # HEALTH_RESERVE_THREADS` (2 reserved threads no solve can ever occupy) and
  # SolveBuild is admission-controlled by a bounded semaphore that refuses
  # with SOLVER_BUSY instead of queueing, so Health/Check keeps threads free
  # even when the solver is fully saturated. That fix has only been read
  # here, not load-tested under real concurrent solves — the base prompt's
  # own stated condition for switching to a gRPC check — so tcp_checks stays.
  # It proves less (only that the port accepts a connection, not that the
  # service can answer), but it is unconditionally immune to this failure
  # mode, costs nothing, and a TCP accept was never the thing in question.
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[env]
  # Caps CONCURRENT solves (config.py's `Settings.max_workers`, default 4
  # if unset). Set to 1 here rather than left at the default — see the
  # sizing note below for the full reasoning; it multiplies with
  # NUM_SEARCH_WORKERS and is this file's half of that tradeoff to set.
  CPSAT_MAX_WORKERS = "1"

# --- sizing: this box is sized for PROOF TIME, not placement -----------------
# Across two independent paired, interleaved A/B runs of 12 on the production
# board, `placed` was 37 of 37 fixtures in every single run, regardless of
# load — this machine size can never hand an organiser a broken or partial
# board. What degrades under contention is `tiers_completed`: how much of the
# T0(placed)->T1(makespan)->T2(idle gap)->T3(court imbalance) chain the
# solver PROVES inside the 8s wall.
#
# This shape is sized to guarantee T0+T1 (tiers_completed=2: every fixture
# placed, makespan proven optimal) within budget under load; T2/T3 are
# best-effort on top of that, exactly the degraded-but-valid shape measured
# on a contended dev box (status=FEASIBLE placed=37 tiers_completed=2
# elapsed_ms~8014). A failure whose `placed` is not 37 would be a real bug,
# not a sizing tradeoff.
#
# Two oversubscription axes feed that risk, and they MULTIPLY:
#   * NUM_SEARCH_WORKERS (src/cp_sat/model.py, hardcoded — not settable
#     from this file or the Dockerfile) is 8, measured on a
#     6-physical-core dev box. shared-cpu-2x is 2 vCPU: unmeasured here,
#     and plausibly oversubscribed even alone — a dev-box A/B already
#     found 4 workers beating 8 and 12 under load (task-3-report.md,
#     task-5b-report.md in the SDD workspace). Re-measure on this machine
#     shape after first deploy; changing the constant is Python source
#     and out of this task's scope.
#   * CPSAT_MAX_WORKERS (set above, default 4 if left unset) caps
#     CONCURRENT solves and is this file's to set. Every NUM_SEARCH_WORKERS
#     measurement above was taken with exactly ONE solve in flight, so the
#     default of 4 concurrent solves would let up to 4 x 8 = 32 solver
#     threads contend for 2 vCPU — a ratio nothing in this programme has
#     ever measured. Pinned to 1 above specifically so the worst case stays
#     the SAME already-discussed 8-threads-on-2-vCPU oversubscription
#     rather than stacking a second, wholly unmeasured axis on top of it.
#     The cost: a second concurrent solve request gets an immediate
#     `SOLVER_BUSY` (main.py's admission control,
#     `BoundedSemaphore.acquire(blocking=False)`).
#
#     WHAT THE CALLER DOES WITH THAT IS NOT WIRED YET — do not read this
#     block as saying the fallback works today. `build.ts` does not import
#     `cpsat-client.ts` at all yet (Task 06), and the `"solver_busy"` +
#     greedy path `build.ts` already has is `MAX_SOLVER_QUEUE`, the LOCAL
#     z3/WASM queue cap, which has nothing to do with this service. The
#     service's `SOLVER_BUSY` (`schema.py:473`) reaches `cpsat-client.ts`'s
#     `toOutcome` as `status:"ERROR"` plus an `error.code`, and nothing
#     reads that back until Task 06b writes the status translation.
#
#     So until 06 and 06b land, a second concurrent organiser does not get
#     a graceful greedy board — they get whatever the unwired error path
#     does. That is the reason 1 is a floor rather than a recommendation.
#     Raise it once concurrent-solve behaviour has actually been measured
#     on this machine shape.

# Secrets (fly secrets set --app cp-sat):
#   CPSAT_SERVICE_SECRET — new, distinct from apps/web's CRON_SECRET. Never
#   reuse that value; a shared secret would let either service authenticate
#   as the other.
