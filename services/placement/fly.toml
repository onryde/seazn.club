# Placement scheduling service — own Fly app, own image, deliberately separate
# from apps/web's (root Dockerfile/fly.toml). gRPC over raw TCP, called by
# apps/web only over Fly's private 6PN network
# (docs/superpowers/specs/2026-08-07-placement-scheduler-design.md, "Security":
# shared-secret auth substitutes for mTLS specifically because 6PN is already
# WireGuard-encrypted and not internet-reachable). Do not allocate a public
# IPv4/v6 for this app — that is a separate, explicit `fly ips allocate-*`
# step nothing here performs, and doing it would contradict that assumption.
#
# `app` MUST be exactly "placement". Fly's private DNS derives from the app
# name, and packages/engine/src/scheduling/placement-client.ts's DEFAULT_HOST is
# the literal string "placement.flycast:50051" (placement-client.ts:157) — NOT
# "placement.internal:50051" (an earlier draft of this comment said .internal;
# see the SCALE TO ZERO note below for why .flycast, not .internal, is
# required once the machine can suspend). It only yields to an explicit
# PLACEMENT_SERVICE_HOST env var, which nothing in this repo currently sets
# (checked: no reference anywhere outside that one file). Naming this app
# anything else breaks the zero-config path silently: every solve dials a
# host that does not exist, the gRPC call fails, and build.ts falls back to
# greedy placement with nothing surfacing why.
app = "placement"
# Matches apps/web's root fly.toml — same Fly region, minimal added latency
# for an RPC that is already budgeted to the second.
primary_region = "lhr"

[build]

# A TCP service block, not [http_service]: that block is HTTP/1.1-oriented
# (methods, paths, force_https) and tuned for the web app's own traffic
# shape. This is gRPC over raw TCP.
[[services]]
  internal_port = 50051
  protocol = "tcp"
  # Fly's own config reference documents both of these identically under
  # [http_service] and a generic [[services]] block — confirmed directly
  # against https://fly.io/docs/reference/configuration/ (fetched twice,
  # independently, after an earlier draft of this file wrongly claimed
  # min_machines_running only exists under [http_service]; it does not).
  #
  # SCALE TO ZERO — owner decision 2026-08-10, reversing this file's
  # original "always warm" stance. The machine is sized for proof time, so
  # it is an expensive thing to leave idle between two organisers clicking
  # a button minutes apart.
  #
  # "suspend", NOT "stop", and the difference is the wall budget:
  # a suspended machine "preserve[s] memory and disk state, and resume[s]
  # faster than `stopped`" (Fly's machine-states docs). A cold start is
  # ~1-3s, an eighth of the 8-10s budget this whole investigation was built
  # around; a resume is not. Billing for the suspended state is NOT
  # documented by Fly (checked: the pricing page covers `stopped` only, at
  # $0.15/GB of rootfs per 30 days) — the expected cost either way is cents,
  # against machine-hours that are not, so this is a latency choice rather
  # than a cost one. If an invoice ever disagrees, "stop" is a one-word
  # change and costs only the cold start.
  #
  # min_machines_running = 0 is what actually permits zero. It only takes
  # effect "when auto_stop_machines is `stop` or `suspend`" (the docs' own
  # wording), so it was inert beside the previous "off".
  #
  # *** THIS SETTING IS INERT — WORSE, SILENTLY HARMFUL — UNLESS THE CALLER
  # DIALS `.flycast`. *** Autostart is a Fly Proxy feature. `<app>.internal`
  # bypasses the proxy and resolves straight to machine IPs, so a suspended
  # machine is simply unreachable: `build.ts` catches the failure and
  # returns a greedy board, which looks like "placement lost on merit" rather
  # than an outage. `placement-client.ts`'s DEFAULT_HOST is `placement.flycast:50051`
  # for exactly this reason, and the private IPv6 that makes `.flycast`
  # resolve is a ONE-TIME manual step (`fly ips allocate-v6 --private`) that
  # nothing here performs. See DEPLOY.md.
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [[services.ports]]
    port = 50051

  # Fan-out for `fly scale count 10` (see DEPLOY.md step 5). `hard_limit = 1`
  # tells Fly Proxy a machine is FULL at one connection, so a second
  # concurrent solve is routed to another machine, autostarting it if it is
  # suspended. Without this block the proxy has no reason to prefer an idle
  # machine over the one it already has a connection to, no matter how many
  # are scaled up — this is the half of Task 12 that makes `placement-client.ts`'s
  # channel-per-solve change (see that file's comment above `newClientFor`)
  # actually reach ten machines instead of ten streams on one connection.
  # `soft_limit` matches `hard_limit` here on purpose: with exactly one
  # in-flight solve meaning "full", there is no useful middle state to prefer
  # one warm machine over another before rejecting/spawning.
  #
  # Whether `tcp_checks` below count against this connection limit — i.e.
  # whether a passing health check could itself pin a machine at "full" and
  # make it look permanently unavailable — is NOT documented. Checked
  # directly against https://fly.io/docs/reference/configuration/,
  # https://fly.io/docs/networking/services/, and
  # https://fly.io/docs/reference/fly-proxy/ (2026-08-10): none states
  # whether a health-check connection is counted toward
  # `services.concurrency`. Could not establish either way; flagged for the
  # owner rather than assumed. If it turns out checks DO count, `hard_limit`
  # needs to be at least 2 (one check + one solve) to avoid a
  # falsely-full machine.
  [services.concurrency]
    type       = "connections"
    hard_limit = 1
    soft_limit = 1

  # A TCP accept, not a gRPC Health/Check — and kept that way deliberately.
  # The Task 04 audit found the original health servicer shared the solve
  # ThreadPoolExecutor: under max_workers concurrent solves, Health/Check
  # returned DEADLINE_EXCEEDED, and a liveness probe using it would kill the
  # machine mid-solve, dropping every in-flight solve with it.
  #
  # Verified in code for this task (src/placement/main.py): that pool-exhaustion
  # bug IS fixed. The RPC thread pool is now sized `max_workers +
  # HEALTH_RESERVE_THREADS` (2 reserved threads no solve can ever occupy) and
  # SolveBuild is admission-controlled by a bounded semaphore that refuses
  # with SOLVER_BUSY instead of queueing, so Health/Check keeps threads free
  # even when the solver is fully saturated. That fix has only been read
  # here, not load-tested under real concurrent solves — the base prompt's
  # own stated condition for switching to a gRPC check — so tcp_checks stays.
  # It proves less (only that the port accepts a connection, not that the
  # service can answer), but it is unconditionally immune to this failure
  # mode, costs nothing, and a TCP accept was never the thing in question.
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[env]
  # Caps CONCURRENT solves (config.py's `Settings.max_workers`, default 4
  # if unset). Set to 1 here rather than left at the default — see the
  # sizing note below for the full reasoning; it multiplies with
  # NUM_SEARCH_WORKERS and is this file's half of that tradeoff to set.
  PLACEMENT_MAX_WORKERS = "1"

  # *** THE SERVER HALVES THE CALLER'S WALL BUDGET, SILENTLY. ***
  # Left UNSET here, so `config.py:39`'s default of 10 applies, and
  # `main.py:142` clamps every request: `min(parsed.wall_seconds,
  # wall_seconds_max)`. The TS side asks for up to 20 s
  # (`AUTO_SOLVER_WALL_MS`, `apps/web/src/server/usecases/schedule.ts`), so
  # HALF the requested proof budget is discarded on every board — measured
  # 2026-08-10, a generated 21-fixture round-robin stalls at
  # `tiers_completed: 1/4` because of it.
  #
  # `placed` is not what degrades — across 24 paired runs it was full
  # placement every time. What degrades is how much of the T0->T3 chain is
  # PROVEN inside the wall, which is exactly the thing this service exists to
  # deliver over greedy.
  #
  # Deliberately not "fixed" here by setting it to 20: raising it trades
  # machine-seconds for proof depth on a box whose real shape has never been
  # measured (`NUM_SEARCH_WORKERS` is still owed a re-measurement, step 8),
  # and doing both at once makes neither attributable. Decide it as one
  # change AFTER the first deploy, with the re-measurement in hand.
  # RAISED FROM THE DEFAULT 10 TO 20 on 2026-08-10, on a production
  # measurement rather than a guess. A real 37-fixture, 3-board Auto-schedule
  # came back:
  #
  #   status=ok  engine=greedy  tiers_completed=1/4
  #   budget_expired=true  elapsed_ms=10644
  #
  # `status=ok` proves the solve REACHED the service — this was never the
  # fallback. What it did not get was time: the app asks for 20s
  # (`AUTO_SOLVER_WALL_MS`), `config.py:39` defaulted the ceiling to 10, and
  # `main.py:142` clamps `min(parsed.wall_seconds, wall_seconds_max)`. The
  # solver burned the whole 10s completing only T0 (maximise placed), so
  # T1 makespan / T2 idle gap / T3 court imbalance never ran — and with no
  # tier beyond T0 it had no chance to strictly beat the greedy seed, which
  # is exactly why `engine` reads `greedy`.
  #
  # 20 matches what the caller actually asks for, so the clamp stops silently
  # discarding half the budget. It does NOT make the wall unbounded: the app
  # still sets it per request, and a machine still answers one solve at a time
  # (`PLACEMENT_MAX_WORKERS = 1` above).
  #
  # STILL OWED, and deliberately NOT changed in the same breath: the worker
  # count below is 8, measured on a 6-core dev box, against this 2-vCPU shape.
  # Change one variable at a time or neither result is attributable — see
  # DEPLOY.md step 8.
  PLACEMENT_WALL_SECONDS_MAX = "10"
  # PLACEMENT_-prefixed, matching every other var this service reads. The
  # unprefixed `NUM_SEARCH_WORKERS` set here on 2026-08-10 did NOTHING —
  # `model.py` hardcoded the constant and `config.py` read only four vars — so
  # four production runs varied the wall and the machine while everyone
  # believed the worker count was moving. It never left 8.
  #
  # Since 2026-08-11 `config.py` reads all three solver knobs and `main.py`
  # passes them into the solve as a `SolverKnobs` value; the domain holds the
  # DEFAULTS only. So an unset variable here is not "8 hardcoded somewhere" —
  # it is `SolverKnobs`'s own default, and the two cannot disagree.
  PLACEMENT_NUM_SEARCH_WORKERS = "8"
  # The two presolve knobs are settable here too and are left UNSET, which
  # means the shipped defaults (symmetry 0, probing 0). Set them to re-measure
  # the "~3x faster with them" tradeoff on a real board without a code deploy:
  #   PLACEMENT_SYMMETRY_LEVEL = "2"
  #   PLACEMENT_PROBING_LEVEL  = "1"
  # If a run comes back UNKNOWN with `placed` collapsing, that is the failure
  # the 0 guards against — loud in the response, and reverted by unsetting.
# --- sizing: this box is sized for PROOF TIME, not placement -----------------
# Across two independent paired, interleaved A/B runs of 12 on the production
# board, `placed` was 37 of 37 fixtures in every single run, regardless of
# load — this machine size can never hand an organiser a broken or partial
# board. What degrades under contention is `tiers_completed`: how much of the
# T0(placed)->T1(makespan)->T2(idle gap)->T3(court imbalance) chain the
# solver PROVES inside the 8s wall.
#
# This shape is sized to guarantee T0+T1 (tiers_completed=2: every fixture
# placed, makespan proven optimal) within budget under load; T2/T3 are
# best-effort on top of that, exactly the degraded-but-valid shape measured
# on a contended dev box (status=FEASIBLE placed=37 tiers_completed=2
# elapsed_ms~8014). A failure whose `placed` is not 37 would be a real bug,
# not a sizing tradeoff.
#
# Two oversubscription axes feed that risk, and they MULTIPLY:
#   * PLACEMENT_NUM_SEARCH_WORKERS (set above; the default lives on
#     `model.SolverKnobs`) is 8, measured on a 6-physical-core dev box.
#     shared-cpu-2x is 2 vCPU: unmeasured here, and plausibly oversubscribed
#     even alone — a dev-box A/B already found 4 workers beating 8 and 12
#     under load (task-3-report.md, task-5b-report.md in the SDD workspace).
#     Re-measure on this machine shape; since 2026-08-11 that is an `[env]`
#     change here, NOT a Python edit and a deploy.
#   * PLACEMENT_MAX_WORKERS (set above, default 4 if left unset) caps
#     CONCURRENT solves and is this file's to set. Every NUM_SEARCH_WORKERS
#     measurement above was taken with exactly ONE solve in flight, so the
#     default of 4 concurrent solves would let up to 4 x 8 = 32 solver
#     threads contend for 2 vCPU — a ratio nothing in this programme has
#     ever measured. Pinned to 1 above specifically so the worst case stays
#     the SAME already-discussed 8-threads-on-2-vCPU oversubscription
#     rather than stacking a second, wholly unmeasured axis on top of it.
#     The cost: a second concurrent solve request gets an immediate
#     `SOLVER_BUSY` (main.py's admission control,
#     `BoundedSemaphore.acquire(blocking=False)`).
#
#     THE CALLER SIDE IS WIRED, as of Task 06b — this note used to say
#     otherwise and that is now stale. `build.ts` imports `placement-client.ts`,
#     and the service's `SOLVER_BUSY` (`schema.py:473`) reaches
#     `placement-client.ts`'s `toOutcome` as `status:"ERROR"` plus
#     `error.code === "SOLVER_BUSY"`, which `build.ts:1483-1484` maps to
#     `greedy("solver_busy")` — a valid board, plus copy (`board.result.busy`,
#     all four locales) that promises a retry helps. That is a different
#     answer from the LOCAL `MAX_SOLVER_QUEUE`/z3-WASM `"solver_busy"` path
#     `build.ts` already had; both land on the same status key on purpose.
#
#     So a second concurrent organiser against ONE machine (PLACEMENT_MAX_WORKERS
#     = 1) already gets a graceful greedy board today, not an unwired error.
#     `[services.concurrency]` above plus `fly scale count 10` (DEPLOY.md
#     step 5) is what turns "graceful fallback for organiser #2" into
#     "organiser #2 gets a real solve on a second machine" — 1 stays a floor
#     for per-machine concurrency; it is machine COUNT that now carries the
#     ten-organiser target, not this value. Raise this only once
#     concurrent-solve behaviour has actually been measured on this machine
#     shape.

# Secrets (fly secrets set --app placement):
#   PLACEMENT_SERVICE_SECRET — new, distinct from apps/web's CRON_SECRET. Never
#   reuse that value; a shared secret would let either service authenticate
#   as the other.
