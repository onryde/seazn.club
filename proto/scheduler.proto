syntax = "proto3";

package seazn.cpsat.v1;

// -- Build/Polish (tier solver) --------------------------------------------

message Slot {
  string court = 1;
  int64 start_at_ms = 2;
}

message Grid {
  repeated Slot slots = 1;
  int32 step_minutes = 2;
}

message Fixture {
  string fixture_id = 1;
  repeated string entrant_ids = 2;
  string division_id = 3;
}

message Assignment {
  string fixture_id = 1;
  string court = 2;
  int64 start_at_ms = 3;
}

message OrderPair {
  string before_fixture_id = 1;
  string after_fixture_id = 2;
}

message DivisionRestRule {
  string division_id = 1;
  // `optional` because 0 is a LEGITIMATE value here ("this division has no
  // minimum rest"), so it cannot be told from an unset field by its value. A
  // rule that is present but carries an unset number is a rule the caller
  // asked for and silently did not get. Contrast `max_fixtures_per_day`
  // below, where 0 means "may not play at all" and is never legitimate, so a
  // value guard reaches it and the field stays required — which also keeps
  // ts-proto typing it as mandatory for the caller.
  optional int32 min_rest_minutes = 2;
}

message DivisionDayCapRule {
  string division_id = 1;
  int32 max_fixtures_per_day = 2;
}

message BuildConstraints {
  int32 match_minutes = 1;
  // `optional` for the same reason as `min_rest_minutes`: 0 is a real answer
  // ("no court turnaround"), and unset arrives as the same 0. Everything else
  // in this message has a value guard that reaches its degenerate case.
  optional int32 gap_minutes = 2;
  repeated DivisionRestRule rest_by_division = 3;
  repeated DivisionDayCapRule day_cap_by_division = 4;
}

enum SolveStatus {
  SOLVE_STATUS_UNSPECIFIED = 0;
  SOLVE_STATUS_OPTIMAL = 1;
  SOLVE_STATUS_FEASIBLE = 2;
  SOLVE_STATUS_INFEASIBLE = 3;
  SOLVE_STATUS_UNKNOWN = 4;
  SOLVE_STATUS_ERROR = 5;
}

// One rung of the lexicographic objective chain and the value it PROVED.
message Tier {
  // `placed` | `makespan` | `idle_gap` | `imbalance`, in that order. The word
  // is shared with the TypeScript caller and only its case convention changes
  // (`idle_gap` <-> `idleGap`); see the DDD standard's ubiquitous-language rule.
  string name = 1;
  // NOT milliseconds for every tier. `makespan`, `idle_gap` and `imbalance`
  // are ms; `placed` is a COUNT of fixtures. The field was called `value_ms`
  // and carried the count regardless, so the name is deliberately
  // unit-neutral rather than documenting the lie.
  int64 value = 2;
}

message SolveError {
  string code = 1;
  string message = 2;
}

message SolveBuildRequest {
  string request_id = 1;
  repeated string courts = 2;
  Grid grid = 3;
  repeated Fixture fixtures = 4;
  repeated Assignment existing = 5;
  repeated OrderPair dependencies = 6;
  BuildConstraints constraints = 7;
  double wall_seconds = 8;
}

message SolveBuildResponse {
  repeated Assignment assignments = 1;
  SolveStatus status = 2;
  int32 tiers_completed = 3;
  repeated Tier objective_values = 4;
  int64 elapsed_ms = 5;
  bool wall_exhausted = 6;
  SolveError error = 7;
}

service SchedulerService {
  rpc SolveBuild(SolveBuildRequest) returns (SolveBuildResponse);
}
