# tools/* holds dev-only harnesses that CONSUME the packages and are imported
# by nothing in apps/ or packages/ (ruling 56): tools/matrix (@seazn/matrix)
# and tools/bench (@seazn/bench). Never in the Fly image (.dockerignore).
# Keep the list itself contiguous: tools/matrix/__tests__/workspace-wiring.test.ts
# reads it line by line and stops at the first line that is not an entry.
packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Hoist exactly the three packages named in apps/web/next.config.js's
# `serverExternalPackages`, and nothing else.
#
# Not a preference — measured. Those three are deliberately NOT bundled, so the
# standalone server keeps a bare `require("<name>")` for each. Under npm they
# hoisted to the repo-root `node_modules`, which `next build` copies to the
# standalone ROOT, so the require resolved. Under pnpm's default linker they sit
# only in `apps/web/node_modules` as symlinks, and Next does not carry those
# into the standalone tree: it copies the `.pnpm` store directories plus the
# root-level links. Probed on a copy of `.next/standalone` taken OUT of the repo
# (inside the repo the probe is worthless — resolution escapes upward into the
# source tree and every lookup succeeds):
#
#   FAIL pdfkit MODULE_NOT_FOUND
#   ok exceljs  .../node_modules/.pnpm/exceljs@4.4.0/...      (root-level, worked)
#
# exceljs resolving and the other two not is the tell: root-level presence is the
# whole difference. Both failures are silent in production — the scheduler falls
# back to LLM
# repair, a designed path, and pdfkit takes the export error path.
#
# This is deliberately three named packages rather than `node-linker=hoisted` or
# `shamefully-hoist`: a blanket hoist restores every one of npm's accidental
# resolutions and with them the class of bug that the strict linker exists to
# surface. Anything added here needs the same kind of evidence.
#
# These live here rather than in `.npmrc` because the repo still drives tasks
# with `npm run` (~30 sites in CI and the root scripts). npm parses `.npmrc` too
# and does not know these keys, so every one of those invocations printed
# `Unknown project config "public-hoist-pattern". This will stop working in the
# next major version of npm.` — a warning today, a hard failure at npm 12.
# pnpm reads its settings from this file, npm never looks at it, so the warning
# is gone and the behaviour is identical.
publicHoistPattern:
  - pdfkit
  - exceljs

# Security floors for transitive deps whose parents pin a vulnerable patch
# (Dependabot alerts, 2026-09-24). Each selector only matches the vulnerable
# range and lifts it to a patched release in the SAME major, so nothing
# crosses a breaking boundary. Drop an entry once its parent ships the fix.
overrides:
  "browserslist@<4.28.7": "^4.29.1"
  "postcss@<8.5.23": "^8.5.28"
  "nanoid@<3.3.18": "^3.3.19"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  "brace-expansion@<1.1.16": "^1.1.21"
  "brace-expansion@>=2.0.0 <2.1.2": "^2.1.7"
  "dompurify@<3.4.13": "^3.4.16"
  "baseline-browser-mapping@<2.11.0": "^2.11.26"
  "fflate@>=0.4.5 <0.4.9": "^0.4.9"
  "@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33": "^4.0.54"

  # Two peer-metadata pins that keep apps/web's resolution byte-identical when a package that brings a SECOND major of
  # @babel/core (7 -> 8) or a first rxjs enters the workspace (Stryker, W1d T15; T15-LOCK). pnpm's autoInstallPeers fills a
  # MISSING peer from the highest version of that name anywhere in the lockfile, and for a range peer it ignores the range:
  # with Stryker's @babel/core 8.0.6 and rxjs 7.8.2 in the lock, apps/web's `next` / `@sentry/nextjs` / `styled-jsx` were
  # re-linked to @babel/core 8.0.6 ("unmet peer @babel/core@^7.0.0: found 8.0.6") and `posthog-node` to rxjs 7.8.2. The
  # @babel/core 7.29.7 that web has always used is named exactly (an exact range is the one form pnpm honours), and
  # posthog-node's optional rxjs peer is dropped (web never installed one). Both change peer METADATA in the lock's
  # `packages:` section only; no importer and no `snapshots:` entry of a production package moves.
  # The first selector names a RANGE of the helper (`@<8`: every 7.x), never its exact version and never no version. An exact
  # `@7.29.7` stopped matching the moment the helper moved (measured in a scratch copy with the helper forced to 7.28.6: apps/web
  # re-linked to @babel/core 8.0.6 under it, and did not under `@<8`), and a selector with no version also pins Stryker's own
  # @babel/helper-module-transforms 8 to @babel/core 7.29.7. tools/matrix/__tests__/lock-isolation.test.ts reads the lock and
  # reds when either override stops holding. Drop both (and that test) when apps/web leaves @babel/core 7, or when
  # packages/engine stops depending on Stryker.
  "@babel/helper-module-transforms@<8>@babel/core": "7.29.7"
  "posthog-node>rxjs": "-"
